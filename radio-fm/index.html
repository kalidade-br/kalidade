<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALIDADE RADIO FM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050507;
    --panel: rgba(15, 15, 22, .82);
    --panel2: rgba(22, 22, 32, .9);
    --border: rgba(255,255,255,.08);
    --text: #fff;
    --muted: #888894;
    --neon: #00f5ff;
    --neon2: #8b5cff;
    --green: #00ff9d;
}

body {
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 10% 0%, rgba(0,245,255,.10), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(139,92,255,.12), transparent 30%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* GRID DE FUNDO */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .25;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 35px 35px;
}

/* TOPO */

header {
    position: sticky;
    top: 0;
    z-index: 50;

    height: 78px;
    padding: 0 24px;

    display: flex;
    align-items: center;
    gap: 20px;

    background: rgba(5,5,7,.78);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-bottom: 1px solid var(--border);
}

/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.5px;

    white-space: nowrap;
}

.logo-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background: linear-gradient(135deg, var(--neon), var(--neon2));
    color: #050507;

    box-shadow:
        0 0 18px rgba(0,245,255,.35),
        0 0 35px rgba(139,92,255,.15);
}

/* PESQUISA */

.search-area {
    width: min(420px, 100%);
    position: relative;
}

.search-area span {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
}

.search {
    width: 100%;
    height: 44px;

    padding: 0 16px 0 43px;

    border: 1px solid var(--border);
    border-radius: 14px;

    outline: none;

    background: rgba(255,255,255,.045);
    color: white;

    font-size: 14px;

    transition: .25s;
}

.search::placeholder {
    color: #666672;
}

.search:focus {
    border-color: rgba(0,245,255,.55);

    box-shadow:
        0 0 0 3px rgba(0,245,255,.07),
        0 0 22px rgba(0,245,255,.08);
}

/* CONTEÚDO */

.container {
    width: min(1050px, 100%);
    margin: auto;
    padding: 30px 20px 170px;
}

/* PLAYER */

.player {
    position: relative;
    overflow: hidden;

    padding: 28px;

    border: 1px solid rgba(0,245,255,.15);
    border-radius: 24px;

    background:
        linear-gradient(135deg,
            rgba(0,245,255,.055),
            rgba(139,92,255,.06)
        ),
        var(--panel);

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.04);

    margin-bottom: 28px;
}

.player::after {
    content: "";

    position: absolute;
    width: 220px;
    height: 220px;

    right: -80px;
    top: -100px;

    background: var(--neon);
    filter: blur(100px);
    opacity: .09;

    pointer-events: none;
}

.player-top {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* CAPA */

.cover {
    width: 82px;
    height: 82px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 20px;

    background:
        linear-gradient(135deg, #101018, #171725);

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 0 30px rgba(0,245,255,.08);

    font-size: 34px;
}

.player-info {
    min-width: 0;
}

.player-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--neon);
    margin-bottom: 6px;
}

.player-title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 800;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-style {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
}

/* STATUS */

.live {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 7px 11px;

    border: 1px solid rgba(0,255,157,.18);
    border-radius: 999px;

    color: var(--green);
    font-size: 11px;
    font-weight: 700;

    background: rgba(0,255,157,.045);
}

.live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: var(--green);

    box-shadow: 0 0 12px var(--green);

    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        opacity: .35;
        transform: scale(.7);
    }
}

/* PLAYER AUDIO */

audio {
    width: 100%;
    margin-top: 22px;
    height: 42px;
}

/* TÍTULO DA LISTA */

.list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 10px 2px 14px;
}

.list-header h2 {
    font-size: 17px;
}

.count {
    color: var(--muted);
    font-size: 12px;
}

/* LISTA */

#lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.radio {
    position: relative;

    display: flex;
    align-items: center;
    gap: 14px;

    padding: 15px;

    border: 1px solid var(--border);
    border-radius: 17px;

    background: var(--panel);

    cursor: pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;
}

.radio:hover {
    transform: translateY(-2px);

    border-color: rgba(0,245,255,.24);

    background: var(--panel2);

    box-shadow:
        0 10px 35px rgba(0,0,0,.25),
        0 0 25px rgba(0,245,255,.035);
}

/* RADIO ATIVA */

.radio.ativa {
    border-color: rgba(0,245,255,.45);

    background:
        linear-gradient(
            100deg,
            rgba(0,245,255,.08),
            rgba(139,92,255,.07)
        );

    box-shadow:
        0 0 25px rgba(0,245,255,.06),
        inset 0 0 25px rgba(0,245,255,.025);
}

.radio-icon {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);

    color: var(--neon);

    font-size: 19px;
}

.radio-info {
    min-width: 0;
    flex: 1;
}

.radio-name {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.radio-style {
    color: #666672;
    font-size: 11px;
    margin-top: 5px;
}

.radio-play {
    width: 37px;
    height: 37px;

    flex-shrink: 0;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 50%;

    background: rgba(255,255,255,.05);
    color: white;

    cursor: pointer;

    transition: .2s;
}

.radio-play:hover {
    background: var(--neon);
    color: #000;

    box-shadow: 0 0 18px rgba(0,245,255,.35);
}

/* STATUS */

#status {
    text-align: center;
    color: var(--muted);
    padding: 30px;
    font-size: 13px;
}

/* PLAYER FIXO INFERIOR */

.bottom-player {
    position: fixed;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    width: min(700px, calc(100% - 24px));

    padding: 10px 15px;

    display: flex;
    align-items: center;
    gap: 13px;

    background: rgba(12,12,17,.86);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;

    box-shadow:
        0 15px 60px rgba(0,0,0,.5),
        0 0 30px rgba(0,245,255,.04);

    z-index: 100;
}

.mini-cover {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: linear-gradient(135deg, var(--neon), var(--neon2));

    color: #000;
}

.mini-info {
    flex: 1;
    min-width: 0;
}

.mini-title {
    font-size: 12px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mini-status {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
}

.mini-equalizer {
    display: flex;
    align-items: end;
    gap: 2px;
    height: 22px;
}

.mini-equalizer i {
    display: block;
    width: 3px;
    border-radius: 5px;
    background: var(--neon);
    animation: equalizer .8s infinite alternate;
}

.mini-equalizer i:nth-child(1) { height: 8px; animation-delay: .1s; }
.mini-equalizer i:nth-child(2) { height: 16px; animation-delay: .3s; }
.mini-equalizer i:nth-child(3) { height: 11px; animation-delay: .15s; }
.mini-equalizer i:nth-child(4) { height: 19px; animation-delay: .4s; }

@keyframes equalizer {
    to {
        height: 5px;
    }
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        height: auto;
        min-height: 72px;

        padding: 12px 15px;

        flex-wrap: wrap;
    }

    .logo {
        font-size: 16px;
    }

    .logo-icon {
        width: 34px;
        height: 34px;
    }

    .search-area {
        order: 3;
        width: 100%;
    }

    .container {
        padding: 20px 14px 150px;
    }

    .player {
        padding: 20px;
        border-radius: 20px;
    }

    .cover {
        width: 65px;
        height: 65px;
        font-size: 27px;
    }

    .live {
        display: none;
    }

    #lista {
        grid-template-columns: 1fr;
    }

    .radio {
        padding: 13px;
    }
}

/* CELULARES MUITO PEQUENOS */

@media (max-width: 380px) {

    .player-title {
        font-size: 18px;
    }

    .bottom-player {
        bottom: 8px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">📻</div>
        KALIDADE RADIO
    </div>

    <!-- PESQUISA NO TOPO -->
    <div class="search-area">
        <span>⌕</span>

        <input
            type="search"
            id="pesquisa"
            class="search"
            placeholder="Pesquisar rádio..."
            autocomplete="off"
        >
    </div>

</header>


<main class="container">

    <!-- PLAYER PRINCIPAL -->

    <section class="player">

        <div class="player-top">

            <div class="cover">
                📻
            </div>

            <div class="player-info">

                <div class="player-label">
                    KALIDADE • AO VIVO
                </div>

                <div class="player-title" id="radioAtual">
                    Nenhuma rádio selecionada
                </div>

                <div class="player-style" id="estiloAtual">
                    Escolha uma rádio abaixo
                </div>

            </div>

            <div class="live">
                <i class="live-dot"></i>
                LIVE
            </div>

        </div>

        <audio
            id="player"
            controls
            preload="none">
        </audio>

    </section>


    <div class="list-header">

        <h2>Estações disponíveis</h2>

        <div class="count" id="contador">
            0 rádios
        </div>

    </div>


    <div id="status">
        Carregando rádios...
    </div>

    <div id="lista"></div>

</main>


<!-- MINI PLAYER -->

<div class="bottom-player">

    <div class="mini-cover">
        📻
    </div>

    <div class="mini-info">

        <div class="mini-title" id="miniNome">
            Nenhuma rádio tocando
        </div>

        <div class="mini-status" id="miniStatus">
            Selecione uma estação
        </div>

    </div>

    <div class="mini-equalizer">

        <i></i>
        <i></i>
        <i></i>
        <i></i>

    </div>

</div>


<script>

let radios = [];
let radioAtual = null;

const player = document.getElementById("player");
const lista = document.getElementById("lista");
const status = document.getElementById("status");
const contador = document.getElementById("contador");

const radioAtualNome = document.getElementById("radioAtual");
const estiloAtual = document.getElementById("estiloAtual");

const miniNome = document.getElementById("miniNome");
const miniStatus = document.getElementById("miniStatus");


/* CARREGAR JSON */

async function carregarRadios() {

    try {

        const resposta = await fetch("1.json");

        if (!resposta.ok) {
            throw new Error("Erro ao carregar 1.json");
        }

        radios = await resposta.json();

        mostrarRadios(radios);

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "❌ Não foi possível carregar as rádios.";

    }

}


/* MOSTRAR RÁDIOS */

function mostrarRadios(listaRadios) {

    lista.innerHTML = "";

    contador.textContent =
        `${listaRadios.length} rádio${listaRadios.length === 1 ? "" : "s"}`;

    if (!listaRadios.length) {

        status.textContent =
            "Nenhuma rádio encontrada.";

        return;

    }

    status.textContent = "";

    listaRadios.forEach((radio) => {

        const card = document.createElement("div");

        card.className = "radio";

        if (radioAtual && radioAtual.id === radio.id) {
            card.classList.add("ativa");
        }

        card.innerHTML = `

            <div class="radio-icon">
                📻
            </div>

            <div class="radio-info">

                <div class="radio-name">
                    ${escaparHTML(radio.titulo)}
                </div>

                ${
                    radio.estilo
                    ? `<div class="radio-style">
                        ${escaparHTML(radio.estilo)}
                       </div>`
                    : ""
                }

            </div>

            <button
                class="radio-play"
                title="Tocar rádio">

                ${radioAtual && radioAtual.id === radio.id && !player.paused
                    ? "❚❚"
                    : "▶"}

            </button>
        `;


        const botao = card.querySelector(".radio-play");


        /* CLICAR NO CARD */

        card.addEventListener("click", (evento) => {

            if (evento.target === botao) {
                return;
            }

            tocarRadio(radio);

        });


        /* BOTÃO PLAY */

        botao.addEventListener("click", () => {

            if (
                radioAtual &&
                radioAtual.id === radio.id &&
                !player.paused
            ) {

                player.pause();

            } else {

                tocarRadio(radio);

            }

        });


        lista.appendChild(card);

    });

}


/* TOCAR RÁDIO */

function tocarRadio(radio) {

    radioAtual = radio;

    radioAtualNome.textContent =
        radio.titulo || "Rádio";

    estiloAtual.textContent =
        radio.estilo || "Rádio online";

    miniNome.textContent =
        radio.titulo || "Rádio";

    miniStatus.textContent =
        radio.estilo || "Ao vivo";


    /* Troca a estação */

    player.src = radio.link;

    player.load();

    player.play()
        .then(() => {

            mostrarRadios(filtrarAtual());

        })
        .catch((erro) => {

            console.error(erro);

            miniStatus.textContent =
                "Não foi possível reproduzir";

            mostrarRadios(filtrarAtual());

        });

}


/* EVENTOS DO PLAYER */

player.addEventListener("play", () => {

    miniStatus.textContent =
        "● Ao vivo";

    mostrarRadios(filtrarAtual());

});


player.addEventListener("pause", () => {

    miniStatus.textContent =
        "Pausado";

    mostrarRadios(filtrarAtual());

});


/* FILTRO */

function filtrarAtual() {

    const termo = normalizar(
        document.getElementById("pesquisa").value
    );

    if (!termo) {
        return radios;
    }

    return radios.filter((radio) => {

        const titulo =
            normalizar(radio.titulo);

        const estilo =
            normalizar(radio.estilo);

        return (
            titulo.includes(termo) ||
            estilo.includes(termo)
        );

    });

}


/* PESQUISA EM TEMPO REAL */

document
    .getElementById("pesquisa")
    .addEventListener("input", () => {

        mostrarRadios(filtrarAtual());

    });


/* NORMALIZAR TEXTO */

function normalizar(texto) {

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* PROTEÇÃO HTML */

function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* INICIAR */

carregarRadios();

</script>

</body>
</html>
