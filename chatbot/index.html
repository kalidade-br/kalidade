<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB BRASIL IA GRATUITA</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --verde:#0a5c3c;
    --verde-escuro:#063d28;
    --amarelo:#f7c500;
    --azul:#0b3d91;
    --bg:#f6f4ea;
    --texto:#12241c;
    --bolha-user:#f7c500;
    --bolha-ia:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--texto);
    display:flex;
    flex-direction:column;
  }
  header{
    background:linear-gradient(135deg,var(--verde) 0%,var(--verde-escuro) 100%);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:140px; height:140px;
    background:radial-gradient(circle, var(--amarelo) 0%, transparent 70%);
    opacity:.35;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    z-index:1;
  }
  .brand .badge{
    width:42px;height:42px;border-radius:50%;
    background:var(--amarelo);
    color:var(--verde-escuro);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;
    box-shadow:0 0 0 3px var(--azul);
  }
  .brand h1{
    font-size:17px;
    margin:0;
    letter-spacing:.5px;
    line-height:1.2;
  }
  .brand span{
    display:block;
    font-size:11px;
    font-weight:400;
    opacity:.85;
  }
  #limpar{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    z-index:1;
    transition:.2s;
  }
  #limpar:hover{background:rgba(255,255,255,.25);}

  #chat{
    flex:1;
    overflow-y:auto;
    padding:20px 14px 100px;
    max-width:760px;
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:82%;
    padding:12px 16px;
    border-radius:16px;
    line-height:1.45;
    font-size:15px;
    white-space:pre-wrap;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    animation:entra .25s ease;
  }
  @keyframes entra{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bolha-user);
    color:var(--verde-escuro);
    border-bottom-right-radius:4px;
  }
  .msg.ia{
    align-self:flex-start;
    background:var(--bolha-ia);
    border:1px solid #e2ddca;
    border-bottom-left-radius:4px;
  }
  .msg.ia.carregando{
    color:#888;
    font-style:italic;
  }
  #vazio{
    text-align:center;
    color:#7a7a6d;
    margin-top:60px;
    font-size:14px;
  }
  #vazio strong{display:block;font-size:20px;color:var(--verde);margin-bottom:6px;}

  form{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--bg);
    border-top:1px solid #e2ddca;
    padding:12px;
    display:flex;
    justify-content:center;
  }
  .campo{
    display:flex;
    gap:8px;
    width:100%;
    max-width:760px;
  }
  #entrada{
    flex:1;
    padding:13px 16px;
    border-radius:24px;
    border:2px solid #e2ddca;
    font-size:15px;
    outline:none;
    background:#fff;
  }
  #entrada:focus{border-color:var(--verde);}
  #enviar{
    background:var(--verde);
    color:#fff;
    border:none;
    width:48px;height:48px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;
    flex-shrink:0;
  }
  #enviar:hover{background:var(--verde-escuro);}
  #enviar:disabled{opacity:.5;cursor:not-allowed;}

  @media (prefers-reduced-motion:reduce){
    .msg{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="badge">BR</div>
    <h1>WEB BRASIL IA GRATUITA<span>Converse com a IA, sem custo</span></h1>
  </div>
  <button id="limpar" type="button">Limpar conversa</button>
</header>

<div id="chat">
  <div id="vazio"><strong>Comece a conversa</strong>Digite uma mensagem abaixo para falar com a IA.</div>
</div>

<form id="form-envio">
  <div class="campo">
    <input id="entrada" type="text" placeholder="Digite sua mensagem..." autocomplete="off" />
    <button id="enviar" type="submit" aria-label="Enviar">➤</button>
  </div>
</form>

<script>
  const CHAVE_STORAGE = "webBrasilIaGratuita_conversa";
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("form-envio");
  const entrada = document.getElementById("entrada");
  const botaoEnviar = document.getElementById("enviar");
  const botaoLimpar = document.getElementById("limpar");
  const vazioEl = document.getElementById("vazio");

  function carregarConversa(){
    try{
      const salvo = localStorage.getItem(CHAVE_STORAGE);
      return salvo ? JSON.parse(salvo) : [];
    }catch(e){
      return [];
    }
  }

  function salvarConversa(mensagens){
    try{
      localStorage.setItem(CHAVE_STORAGE, JSON.stringify(mensagens));
    }catch(e){
      console.error("Não foi possível salvar no localStorage:", e);
    }
  }

  let conversa = carregarConversa();

  function renderizarMensagem(texto, autor){
    const bolha = document.createElement("div");
    bolha.className = "msg " + (autor === "user" ? "user" : "ia");
    bolha.textContent = texto;
    chatEl.appendChild(bolha);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bolha;
  }

  function renderizarTudo(){
    chatEl.innerHTML = "";
    if(conversa.length === 0){
      chatEl.appendChild(vazioEl);
      return;
    }
    conversa.forEach(m => renderizarMensagem(m.texto, m.autor));
  }

  renderizarTudo();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = entrada.value.trim();
    if(!texto) return;

    entrada.value = "";
    botaoEnviar.disabled = true;

    conversa.push({ autor: "user", texto });
    salvarConversa(conversa);
    renderizarTudo();

    const bolhaCarregando = renderizarMensagem("Pensando...", "ia");
    bolhaCarregando.classList.add("carregando");

    try{
      const historico = conversa.map(m => ({
        role: m.autor === "user" ? "user" : "assistant",
        content: m.texto
      }));

      const resposta = await puter.ai.chat(historico, {
        model: "gemini-3.6-flash"
      });

      const textoResposta = typeof resposta === "string"
        ? resposta
        : (resposta?.message?.content || resposta?.text || JSON.stringify(resposta));

      conversa.push({ autor: "ia", texto: textoResposta });
      salvarConversa(conversa);
      renderizarTudo();
    }catch(erro){
      conversa.push({ autor: "ia", texto: "Erro ao obter resposta da IA. Tente novamente." });
      salvarConversa(conversa);
      renderizarTudo();
      console.error(erro);
    }finally{
      botaoEnviar.disabled = false;
      entrada.focus();
    }
  });

  botaoLimpar.addEventListener("click", () => {
    if(confirm("Tem certeza que deseja apagar toda a conversa?")){
      conversa = [];
      salvarConversa(conversa);
      renderizarTudo();
    }
  });
</script>

</body>
</html>
