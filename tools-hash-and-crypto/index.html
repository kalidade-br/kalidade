    }

    function copyToClipboard(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied to clipboard!');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied to clipboard!');
      });
    }

        b = HH(b, c, d, a, x[k+2], S34, 0xC4AC5665);
        a = II(a, b, c, d, x[k+0], S41, 0xF4292244);
        d = II(d, a, b, c, x[k+7], S42, 0x432AFF97);
        c = II(c, d, a, b, x[k+14], S43, 0xAB9423A7);
        b = II(b, c, d, a, x[k+5], S44, 0xFC93A039);
        a = II(a, b, c, d, x[k+12], S41, 0x655B59C3);
        d = II(d, a, b, c, x[k+3], S42, 0x8F0CCC92);
        c = II(c, d, a, b, x[k+10], S43, 0xFFEFF47D);
        b = II(b, c, d, a, x[k+1], S44, 0x85845DD1);
        a = II(a, b, c, d, x[k+8], S41, 0x6FA87E4F);
        d = II(d, a, b, c, x[k+15], S42, 0xFE2CE6E0);
        c = II(c, d, a, b, x[k+6], S43, 0xA3014314);
        b = II(b, c, d, a, x[k+13], S44, 0x4E0811A1);
        a = II(a, b, c, d, x[k+4], S41, 0xF7537E82);
        d = II(d, a, b, c, x[k+11], S42, 0xBD3AF235);
        c = II(c, d, a, b, x[k+2], S43, 0x2AD7D2BB);
        b = II(b, c, d, a, x[k+9], S44, 0xEB86D391);
        a = addUnsigned(a, AA);
        b = addUnsigned(b, BB);
        c = addUnsigned(c, CC);
        d = addUnsigned(d, DD);
      }
      return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
    }

    // Modern Native WebCrypto SHA-1, SHA-256, SHA-384, SHA-512
    async function hashWebCrypto(algorithm, data) {
      const buffer = typeof data === 'string' ? new TextEncoder().encode(data) : data;
      const hashBuffer = await crypto.subtle.digest(algorithm, buffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // HMAC with WebCrypto
    async function hmacWebCrypto(hashAlgo, keyText, messageText) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw',
        enc.encode(keyText),
        { name: 'HMAC', hash: { name: hashAlgo } },
        false,
        ['sign']
      );
      const signature = await crypto.subtle.sign('HMAC', key, enc.encode(messageText));
      return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Base32 & Base58 implementations
    const Base58 = {
      ALPHABET: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',
      encode(buffer) {
        if (!buffer || buffer.length === 0) return '';
        let digits = [0];
        for (let i = 0; i < buffer.length; i++) {
          for (let j = 0; j < digits.length; j++) digits[j] <<= 8;
          digits[0] += buffer[i];
          let carry = 0;
          for (let j = 0; j < digits.length; ++j) {
            digits[j] += carry;
            carry = (digits[j] / 58) | 0;
            digits[j] %= 58;
          }
          while (carry) {
            digits.push(carry % 58);
            carry = (carry / 58) | 0;
          }
        }
        for (let i = 0; i < buffer.length && buffer[i] === 0; i++) digits.push(0);
        return digits.reverse().map(d => Base58.ALPHABET[d]).join('');
      },
      decode(str) {
        if (!str || str.length === 0) return new Uint8Array(0);
        let bytes = [0];
        for (let i = 0; i < str.length; i++) {
          let c = str[i];
          let val = Base58.ALPHABET.indexOf(c);
          if (val === -1) throw new Error('Illegal Base58 character: ' + c);
          for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
          bytes[0] += val;
          let carry = 0;
          for (let j = 0; j < bytes.length; ++j) {
            bytes[j] += carry;
            carry = bytes[j] >> 8;
            bytes[j] &= 0xff;
          }
          while (carry) {
            bytes.push(carry & 0xff);
            carry >>= 8;
          }
        }
        for (let i = 0; i < str.length && str[i] === '1'; i++) bytes.push(0);
        return new Uint8Array(bytes.reverse());
      }
    };

    const Base32 = {
      ALPHABET: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',
      encode(bytes) {
        let bits = 0, value = 0, output = '';
        for (let i = 0; i < bytes.length; i++) {
          value = (value << 8) | bytes[i];
          bits += 8;
          while (bits >= 5) {
            output += this.ALPHABET[(value >>> (bits - 5)) & 31];
            bits -= 5;
          }
        }
        if (bits > 0) output += this.ALPHABET[(value << (5 - bits)) & 31];
        while (output.length % 8 !== 0) output += '=';
        return output;
      },
      decode(s) {
        s = s.replace(/=+$/, '').toUpperCase();
        let bits = 0, value = 0;
        let bytes = [];
        for (let i = 0; i < s.length; i++) {
          let val = this.ALPHABET.indexOf(s[i]);
          if (val === -1) continue;
          value = (value << 5) | val;
          bits += 5;
          if (bits >= 8) {
            bytes.push((value >>> (bits - 8)) & 255);
            bits -= 8;
          }
        }
        return new Uint8Array(bytes);
      }
    };

    // Hex dump utility (like xxd)
    function generateHexDump(buffer) {
      let lines = [];
      for (let i = 0; i < buffer.length; i += 16) {
        let slice = buffer.slice(i, i + 16);
        let offset = i.toString(16).padStart(8, '0');
        let hexParts = [];
        let asciiParts = [];
        for (let j = 0; j < 16; j++) {
          if (j < slice.length) {
            hexParts.push(slice[j].toString(16).padStart(2, '0'));
            asciiParts.push((slice[j] >= 32 && slice[j] <= 126) ? String.fromCharCode(slice[j]) : '.');
          } else {
            hexParts.push('  ');
          }
        }
        let hexFormatted = hexParts.slice(0, 8).join(' ') + '  ' + hexParts.slice(8).join(' ');
        lines.push(`${offset}:  ${hexFormatted}  |${asciiParts.join('')}|`);
      }
      return lines.join('\n');
    }

    // Native WebCrypto AES-GCM & AES-CBC
    async function deriveAesKey(passphrase, salt, length = 256) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
      return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: length },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function aesEncryptGcm(plaintext, passphrase) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveAesKey(passphrase, salt);
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        enc.encode(plaintext)
      );
      // Combine salt + iv + ciphertext into a single Base64 string
      const total = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
      total.set(salt, 0);
      total.set(iv, salt.length);
      total.set(new Uint8Array(ciphertext), salt.length + iv.length);
      return btoa(String.fromCharCode(...total));
    }

    async function aesDecryptGcm(b64Ciphertext, passphrase) {
      const raw = Uint8Array.from(atob(b64Ciphertext), c => c.charCodeAt(0));
      if (raw.length < 28) throw new Error('Ciphertext too short');
      const salt = raw.slice(0, 16);
      const iv = raw.slice(16, 28);
      const data = raw.slice(28);
      const key = await deriveAesKey(passphrase, salt);
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        data
      );
      return new TextDecoder().decode(decrypted);
    }

            <button class="btn btn-sm" id="btn-copy-uuids">Copy All</button>
          </div>
          <textarea id="uuid-output" rows="8" readonly></textarea>
        </div>
      `;

      function genV4() {
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
      }

      function genV7() {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        const timestamp = Date.now();
        bytes[0] = (timestamp / 0x10000000000) & 0xff;
        bytes[1] = (timestamp / 0x100000000) & 0xff;
        bytes[2] = (timestamp / 0x1000000) & 0xff;
        bytes[3] = (timestamp / 0x10000) & 0xff;
        bytes[4] = (timestamp / 0x100) & 0xff;
        bytes[5] = timestamp & 0xff;
        bytes[6] = (bytes[6] & 0x0f) | 0x70; // version 7
        bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant RFC 4122
        return Array.from(bytes).map((b, i) =>
          ([4, 6, 8, 10].includes(i) ? '-' : '') + b.toString(16).padStart(2, '0')
        ).join('');
      }

      function generate() {
        const count = Math.min(Math.max(parseInt(document.getElementById('uuid-count').value, 10) || 1, 1), 50);
        const ver = document.getElementById('uuid-ver').value;
        let list = [];
        for (let i = 0; i < count; i++) {
          list.push(ver === 'v7' ? genV7() : genV4());
        }
        document.getElementById('uuid-output').value = list.join('\n');
      }

      document.getElementById('btn-gen-uuid').onclick = generate;
      document.getElementById('btn-copy-uuids').onclick = () => copyToClipboard(document.getElementById('uuid-output').value);
      generate();
    }

            <label>Length:</label>
            <input type="number" id="pwd-len" min="6" max="64" value="20" style="width: 70px;">
          </div>
          <div class="setting-item">
            <label><input type="checkbox" id="pwd-upper" checked> Uppercase (A-Z)</label>
          </div>
          <div class="setting-item">
            <label><input type="checkbox" id="pwd-lower" checked> Lowercase (a-z)</label>
          </div>
          <div class="setting-item">
            <label><input type="checkbox" id="pwd-num" checked> Numbers (0-9)</label>
          </div>
          <div class="setting-item">
            <label><input type="checkbox" id="pwd-sym" checked> Symbols (!@#$%^&*)</label>
          </div>
          <button class="btn btn-sm btn-primary" id="btn-gen-pwd">Regenerate</button>
        </div>
        <div class="card">
          <div class="card-title">
            <span>Generated Password</span>
            <button class="btn btn-sm" id="btn-copy-pwd">Copy Password</button>
          </div>
          <input type="text" id="pwd-output" readonly style="font-size:18px; font-weight:600; letter-spacing:1px; padding:14px;">
        </div>
      `;

      function generate() {
        const len = parseInt(document.getElementById('pwd-len').value, 10) || 20;
        let charset = '';
        if (document.getElementById('pwd-upper').checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (document.getElementById('pwd-lower').checked) charset += 'abcdefghijklmnopqrstuvwxyz';
        if (document.getElementById('pwd-num').checked) charset += '0123456789';
        if (document.getElementById('pwd-sym').checked) charset += '!@#$%^&*()_+~|}{[]:;?><,./-=';
        if (!charset) charset = 'abcdefghijklmnopqrstuvwxyz0123456789';

        const rand = crypto.getRandomValues(new Uint32Array(len));
        let res = '';
        for (let i = 0; i < len; i++) {
          res += charset[rand[i] % charset.length];
        }
        document.getElementById('pwd-output').value = res;
      }

      document.getElementById('btn-gen-pwd').onclick = generate;
      document.getElementById('btn-copy-pwd').onclick = () => copyToClipboard(document.getElementById('pwd-output').value);
      generate();
    }

    // 16. QR Code Generator
    function renderQrView(container) {
      container.innerHTML += `
        <div class="grid-2">
          <div class="card">
            <div class="card-title"><span>Text or URL</span></div>
            <textarea id="qr-input" placeholder="Type text, URL, or WiFi string to generate QR code...">https://github.com</textarea>
          </div>
          <div class="card" id="qr-display">
            <div class="card-title"><span>QR Code Preview</span></div>
            <div id="qr-result"></div>
          </div>
        </div>
      `;

      const input = document.getElementById('qr-input');
      const result = document.getElementById('qr-result');

      function update() {
        if (!input.value.trim()) { result.innerHTML = ''; return; }
        result.innerHTML = generateQrSvg(input.value.trim());
      }

      input.oninput = update;
      update();
    }

    // 17. Text Diff & Compare
    function renderDiffView(container) {
      container.innerHTML += `
        <div class="grid-2">
          <div class="card">
            <div class="card-title"><span>Original Text</span></div>
            <textarea id="diff-original" placeholder="Paste original text here..."></textarea>
          </div>
          <div class="card">
            <div class="card-title"><span>Modified Text</span></div>
            <textarea id="diff-modified" placeholder="Paste modified text here..."></textarea>
          </div>
        </div>
        <div class="card" style="margin-top:20px;">
          <div class="card-title"><span>Comparison / Differences</span></div>
          <div id="diff-output" style="font-family:var(--font-mono); font-size:13px; line-height:1.6; white-space:pre-wrap; min-height:100px;"></div>
        </div>
      `;

      const orig = document.getElementById('diff-original');
      const mod = document.getElementById('diff-modified');
      const out = document.getElementById('diff-output');

      function compare() {
        const l1 = orig.value.split('\n');
        const l2 = mod.value.split('\n');
        let html = '';
        const max = Math.max(l1.length, l2.length);
        for (let i = 0; i < max; i++) {
          const a = l1[i];
          const b = l2[i];
          if (a === b) {
            html += `<div style="color:var(--text-muted); padding:2px 6px;">  ${a || ''}</div>`;
          } else {
            if (a !== undefined) html += `<div style="background:rgba(239, 68, 68, 0.2); color:#f87171; padding:2px 6px;">- ${a}</div>`;
            if (b !== undefined) html += `<div style="background:rgba(16, 185, 129, 0.2); color:#34d399; padding:2px 6px;">+ ${b}</div>`;
          }
        }
        out.innerHTML = html || '<span style="color:var(--text-muted)">Enter text in both boxes to compare.</span>';
      }

      orig.oninput = compare;
      mod.oninput = compare;
    }

    // 18. Text Stats & Byte Counter
    function renderStatsView(container) {
      container.innerHTML += `
        <div class="card" style="margin-bottom:20px;">
          <div class="card-title"><span>Text Input</span></div>
          <textarea id="stats-input" placeholder="Type or paste any text to inspect real-time metrics..."></textarea>
        </div>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;">
          <div class="card"><div class="card-title">Characters</div><h2 id="st-chars">0</h2></div>
          <div class="card"><div class="card-title">Words</div><h2 id="st-words">0</h2></div>
          <div class="card"><div class="card-title">Lines</div><h2 id="st-lines">0</h2></div>
          <div class="card"><div class="card-title">UTF-8 Bytes</div><h2 id="st-bytes">0</h2></div>
        </div>
      `;

      const input = document.getElementById('stats-input');
      input.oninput = () => {
        const text = input.value;
        document.getElementById('st-chars').textContent = text.length;
        document.getElementById('st-words').textContent = (text.trim().match(/\S+/g) || []).length;
        document.getElementById('st-lines').textContent = text ? text.split('\n').length : 0;
        document.getElementById('st-bytes').textContent = new TextEncoder().encode(text).length;
      };
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      // Sidebar Mobile Controls
      const sidebarToggle = document.getElementById('sidebar-toggle');
      if (sidebarToggle) sidebarToggle.onclick = openSidebar;

      const sidebarClose = document.getElementById('sidebar-close');
      if (sidebarClose) sidebarClose.onclick = closeSidebar;

      const sidebarMask = document.getElementById('sidebar-mask');
      if (sidebarMask) sidebarMask.onclick = closeSidebar;

      // Dark / Light Theme Toggle
      const themeBtn = document.getElementById('theme-toggle');
      themeBtn.onclick = () => {
        document.body.classList.toggle('light-theme');
      };

      // Search Filter
      document.getElementById('tool-search').oninput = (e) => {
        renderNav(e.target.value);
      };

      // Top action buttons
      document.getElementById('btn-clear').onclick = () => {
        const firstArea = document.querySelector('#tool-view textarea, #tool-view input[type="text"]');
        if (firstArea) {
          firstArea.value = '';
          firstArea.dispatchEvent(new Event('input'));
        }
      };

      document.getElementById('btn-copy-output').onclick = () => {
        const out = document.querySelector('#tool-view textarea[readonly], #tool-view input[readonly]');
        if (out) copyToClipboard(out.value);
      };

      // Check URL hash for direct tool linking
      const hash = window.location.hash.replace('#', '');
      const match = TOOLS.find(t => t.id === hash);
      if (match) currentTool = match;

      renderNav();
      selectTool(currentTool);
    });
  </script>
</body>
</html>
