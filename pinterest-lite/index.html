<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALIDADE PINTEREST</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,8,8,.95);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid #222;
    padding: 14px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.logo span {
    color: #00ff88;
}

.search {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #333;
    outline: none;
    border-radius: 25px;
    background: #151515;
    color: white;
    font-size: 15px;
}

.search:focus {
    border-color: #00ff88;
}

/* GRID */
.grid {
    padding: 15px;
    columns: 2 180px;
    column-gap: 12px;
}

.card {
    break-inside: avoid;
    margin-bottom: 12px;
    cursor: pointer;
    position: relative;
}

.card img {
    width: 100%;
    display: block;
    border-radius: 12px;
    background: #151515;
    transition: .2s;
}

.card:hover img {
    transform: scale(1.015);
}

.title {
    padding: 7px 3px 2px;
    font-size: 13px;
    font-weight: bold;
    color: #ddd;
}

/* LOAD MORE */
.load-area {
    text-align: center;
    padding: 20px;
}

.load-btn {
    background: #00ff88;
    border: none;
    color: #000;
    font-weight: bold;
    padding: 13px 25px;
    border-radius: 25px;
    cursor: pointer;
}

.load-btn:disabled {
    opacity: .4;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,.94);
    overflow-y: auto;
    padding: 20px;
}

.modal.active {
    display: block;
}

.close {
    position: fixed;
    right: 18px;
    top: 15px;
    z-index: 1000;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.viewer {
    max-width: 900px;
    margin: 35px auto 20px;
    text-align: center;
}

.viewer img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 15px;
}

.viewer h2 {
    margin-top: 15px;
    font-size: 20px;
}

/* SIMILARES */
.similar-title {
    max-width: 1200px;
    margin: 35px auto 15px;
    font-size: 20px;
}

.similar-grid {
    max-width: 1200px;
    margin: auto;
    columns: 2 180px;
    column-gap: 12px;
}

.similar-card {
    break-inside: avoid;
    margin-bottom: 12px;
    cursor: pointer;
}

.similar-card img {
    width: 100%;
    display: block;
    border-radius: 12px;
}

.similar-card p {
    padding: 6px 2px;
    font-size: 12px;
    color: #ccc;
}

/* STATUS */
.status {
    text-align: center;
    color: #888;
    padding: 15px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        KALIDADE <span>PINTEREST</span>
    </div>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar fotos..."
        autocomplete="off"
    >
</header>

<main>
    <div id="status" class="status">
        Carregando fotos...
    </div>

    <div id="grid" class="grid"></div>

    <div class="load-area">
        <button id="loadBtn" class="load-btn">
            CARREGAR MAIS 100
        </button>
    </div>
</main>

<!-- MODAL -->
<div id="modal" class="modal">

    <button id="closeBtn" class="close">×</button>

    <div class="viewer">
        <img id="viewerImg" src="" alt="">
        <h2 id="viewerTitle"></h2>
    </div>

    <h3 class="similar-title">
        Fotos semelhantes
    </h3>

    <div id="similarGrid" class="similar-grid"></div>

</div>

<script>
let fotos = [];
let resultados = [];

let pagina = 0;
const POR_PAGINA = 100;

const grid = document.getElementById("grid");
const loadBtn = document.getElementById("loadBtn");
const search = document.getElementById("search");
const status = document.getElementById("status");

const modal = document.getElementById("modal");
const viewerImg = document.getElementById("viewerImg");
const viewerTitle = document.getElementById("viewerTitle");
const similarGrid = document.getElementById("similarGrid");
const closeBtn = document.getElementById("closeBtn");


/* =========================
   CARREGAR JSON
========================= */

async function carregarFotos() {

    try {

        const resposta = await fetch("fotos.json");

        if (!resposta.ok) {
            throw new Error("Erro ao carregar fotos.json");
        }

        fotos = await resposta.json();

        if (!Array.isArray(fotos)) {
            throw new Error("fotos.json precisa ser um array");
        }

        resultados = fotos;

        status.textContent =
            `${fotos.length.toLocaleString("pt-BR")} fotos encontradas`;

        renderizar();

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "Erro ao carregar fotos.json";

    }
}


/* =========================
   RENDERIZAR 100 POR VEZ
========================= */

function renderizar(limpar = false) {

    if (limpar) {
        grid.innerHTML = "";
        pagina = 0;
    }

    const inicio = pagina * POR_PAGINA;
    const fim = inicio + POR_PAGINA;

    const lote = resultados.slice(inicio, fim);

    lote.forEach(foto => {

        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");

        img.src = foto.src;
        img.alt = foto.título || "Foto";

        img.loading = "lazy";

        img.onerror = () => {
            img.style.display = "none";
        };

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = foto.título || "Sem título";

        card.appendChild(img);
        card.appendChild(title);

        card.onclick = () => abrirFoto(foto);

        grid.appendChild(card);
    });

    pagina++;

    atualizarBotao();
}


/* =========================
   BOTÃO MAIS 100
========================= */

function atualizarBotao() {

    const carregadas = pagina * POR_PAGINA;

    if (carregadas >= resultados.length) {

        loadBtn.disabled = true;
        loadBtn.textContent = "TODAS AS FOTOS CARREGADAS";

    } else {

        loadBtn.disabled = false;

        const restantes = resultados.length - carregadas;

        loadBtn.textContent =
            `CARREGAR MAIS ${Math.min(100, restantes)}`;
    }
}


loadBtn.onclick = () => {
    renderizar();
};


/* =========================
   BUSCA
========================= */

search.addEventListener("input", () => {

    const termo = search.value
        .trim()
        .toLowerCase();

    if (!termo) {

        resultados = fotos;

        status.textContent =
            `${fotos.length.toLocaleString("pt-BR")} fotos`;

    } else {

        /*
         * A busca pesquisa TODO o JSON,
         * não apenas as 100 que estão na tela.
         */

        resultados = fotos.filter(foto => {

            const titulo =
                String(foto.título || "").toLowerCase();

            const src =
                String(foto.src || "").toLowerCase();

            return titulo.includes(termo) ||
                   src.includes(termo);
        });

        status.textContent =
            `${resultados.length.toLocaleString("pt-BR")} resultado(s)`;
    }

    renderizar(true);
});


/* =========================
   PALAVRAS SEMELHANTES
========================= */

function palavras(texto) {

    return String(texto || "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu, "")
        .split(/\s+/)
        .filter(p => p.length >= 3);
}


function calcularSemelhanca(a, b) {

    const palavrasA = palavras(a);
    const palavrasB = palavras(b);

    if (!palavrasA.length || !palavrasB.length)
        return 0;

    let pontos = 0;

    palavrasA.forEach(palavra => {

        if (palavrasB.includes(palavra)) {
            pontos++;
        }
    });

    return pontos;
}


/* =========================
   ABRIR FOTO
========================= */

function abrirFoto(foto) {

    modal.classList.add("active");

    viewerImg.src = foto.src;
    viewerImg.alt = foto.título || "";

    viewerTitle.textContent =
        foto.título || "Sem título";

    similarGrid.innerHTML = "";

    const semelhantes = fotos
        .filter(item => item !== foto)
        .map(item => ({
            foto: item,
            score: calcularSemelhanca(
                foto.título,
                item.título
            )
        }))
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 50);

    semelhantes.forEach(item => {

        const card = document.createElement("div");
        card.className = "similar-card";

        const img = document.createElement("img");

        img.src = item.foto.src;
        img.alt = item.foto.título || "";

        img.loading = "lazy";

        const title = document.createElement("p");

        title.textContent =
            item.foto.título || "Sem título";

        card.appendChild(img);
        card.appendChild(title);

        card.onclick = () =>
            abrirFoto(item.foto);

        similarGrid.appendChild(card);
    });
}


/* =========================
   FECHAR
========================= */

closeBtn.onclick = () => {
    modal.classList.remove("active");
};

modal.addEventListener("click", e => {

    if (e.target === modal) {
        modal.classList.remove("active");
    }

});


document.addEventListener("keydown", e => {

    if (e.key === "Escape") {
        modal.classList.remove("active");
    }

});


/* =========================
   INICIAR
========================= */

carregarFotos();

</script>

</body>
      </html>
