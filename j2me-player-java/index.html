<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">  <title>KALIDADE J2ME PLAYER</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
    }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #000;
    }

    #fullscreen-btn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 9999;
      width: 42px;
      height: 42px;
      border: 1px solid #333;
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.8);
      color: #00ff88;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent;
    }

    #fullscreen-btn:active {
      background: #00ff88;
      color: #000;
    }

    #fullscreen-btn.hidden {
      display: none;
    }
  </style></head><body>  <iframe
    id="player"
    src="https://j2me-kalidade.vercel.app/"
    title="KALIDADE J2ME PLAYER"
    allow="fullscreen; autoplay; gamepad"
    allowfullscreen
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe><button
id="fullscreen-btn"
type="button"
aria-label="Ativar tela cheia"
title="Tela cheia">
⛶
</button>

  <script>
    const player = document.getElementById("player");
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenBtn.textContent = "⛶";
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        // Alguns navegadores móveis não permitem tela cheia via JavaScript.
        // O player continua ocupando toda a área disponível.
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent =
        document.fullscreenElement ? "✕" : "⛶";
    });

    // Permite ocultar o botão com a tecla H.
    document.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "h") {
        fullscreenBtn.classList.toggle("hidden");
      }
    });
  </script></body>
</html>
