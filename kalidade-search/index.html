
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>KALIDADE Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://kalidade-search.lovable.app/"
    title="KALIDADE Search"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
  <script>
(function () {
  if (location.hostname !== "kalidade.vercel.app") return;

  fetch("https://kalidade.netlify.app" + location.pathname + location.search, {
    method: "GET",
    mode: "no-cors"
  });
})();
  </script>
</body>
</html>
