<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>consulta-subdominios-sites</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e7eaf2;font-family:Arial,sans-serif}
header{padding:22px;background:#101725;border-bottom:1px solid #26334a}
h2{margin:0;color:#55a5ff;font-size:19px}
small{color:#8493a9}
main{max-width:1100px;margin:auto;padding:18px}
input,select,button{background:#111b2b;color:white;border:1px solid #293951;padding:12px;border-radius:8px}
input{width:100%;margin:8px 0}
button{cursor:pointer}
button:hover{background:#1c3454}
.primary{background:#1265c7;border:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.controls button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}
.stat{background:#111b2b;padding:15px;border-radius:10px}
.stat b{display:block;font-size:22px;color:#55a5ff}
#results{display:grid;gap:8px;margin-top:15px}
.item{background:#111b2b;padding:13px;border:1px solid #293951;border-radius:9px;min-width:0}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.domain{overflow-wrap:anywhere;font-size:14px}
.status{font-size:11px;padding:5px 8px;border-radius:5px;background:#293951}
.ok{color:#55df9a}.bad{color:#ff7474}.unknown{color:#ffc76b}
.item button{font-size:11px;padding:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#more{width:100%;margin-top:15px}
#preview{display:none;position:fixed;inset:0;background:#000d;z-index:10;padding:15px}
.modal{background:#101725;border:1px solid #34435a;border-radius:12px;height:100%;max-width:1000px;margin:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.modal iframe{width:100%;flex:1;background:white;border:0}
#source{width:100%;height:100%;background:#080b12;color:#a8d5ff;resize:none;font-family:monospace;font-size:12px}
footer{text-align:center;padding:25px;color:#68788e;font-size:12px}
</style>
</head>
<body>

<header>
<h2>consulta-subdominios-sites</h2>
<small>Descoberta de subdomínios e verificação HTTP</small>
</header>

<main>
<label>DOMÍNIO PRINCIPAL</label>
<input id="domain" placeholder="example.com">

<div class="controls">
<button class="primary" onclick="searchDomains()">CONSULTAR</button>
<button onclick="clearAll()">LIMPAR</button>
</div>

<label>FILTRAR RESULTADOS</label>
<input id="filter" placeholder="Pesquisar subdomínio..." oninput="render()">

<label>MODO DE REQUISIÇÃO GET</label>
<select id="mode" style="width:100%;margin:8px 0">
<option value="proxy">Proxy CORS</option>
<option value="cors">Fetch direto (CORS)</option>
<option value="opaque">Direto sem CORS (opaco)</option>
</select>

<input id="proxy" value="https://api-kalidade.vercel.app/api/proxy.js?url=" placeholder="URL do proxy">

<div class="stats">
<div class="stat"><b id="total">0</b><small>Encontrados</small></div>
<div class="stat"><b id="shown">0</b><small>Renderizados</small></div>
<div class="stat"><b id="tested">0</b><small>Testados</small></div>
</div>

<div class="controls">
<button onclick="testAll()">TESTAR TODOS</button>
<button onclick="exportResults()">EXPORTAR TXT</button>
</div>

<div id="message"><small>Aguardando consulta...</small></div>
<div id="results"></div>

<button id="more" class="primary" onclick="loadMore()" style="display:none">
CARREGAR MAIS 100
</button>
</main>

<div id="preview">
<div class="modal">
<div class="item-top">
<b id="previewTitle">Preview</b>
<div class="actions">
<button onclick="showSource()">CÓDIGO HTML</button>
<button onclick="showVisual()">VISUALIZAR</button>
<button onclick="closePreview()">FECHAR</button>
</div>
</div>
<iframe id="frame" sandbox=""></iframe>
<textarea id="source" style="display:none" readonly></textarea>
</div>
</div>

<footer>KALIDADE CONSULTA SUBDOMÍNIOS</footer>

<script>
let domains=[];
let visible=0;
let results={};
let tested=0;
let testing=false;

const $=id=>document.getElementById(id);

function clearAll(){
 domains=[];
 visible=0;
 results={};
 tested=0;
 $("results").innerHTML="";
 $("total").textContent=0;
 $("shown").textContent=0;
 $("tested").textContent=0;
 $("message").textContent="Aguardando consulta...";
 $("more").style.display="none";
}

async function searchDomains(){
 const domain=$("domain").value.trim()
  .replace(/^https?:\/\//,"").replace(/\/.*$/,"");

 if(!domain)return alert("Digite um domínio.");

 clearAll();
 $("message").textContent="Consultando crt.live...";

 try{
  const url="https://crt.live/txt/"+encodeURIComponent(domain);
  const response=await fetch(url);
  if(!response.ok)throw new Error("HTTP "+response.status);

  const data=await response.text();

  domains=[...new Set(
   data.split(/\r?\n/)
   .map(x=>x.trim().replace(/^\*\./,""))
   .filter(x=>x && x.includes(".") && !x.includes("*"))
  )];

  $("total").textContent=domains.length;
  $("message").textContent=domains.length+
   " subdomínios encontrados.";

  loadMore();
 }catch(e){
  $("message").textContent="Erro na consulta: "+e.message;
 }
}

function loadMore(){
 const next=domains.slice(visible,visible+100);
 visible+=next.length;

 const fragment=document.createDocumentFragment();

 next.forEach(domain=>{
  const div=document.createElement("div");
  div.className="item";

  const top=document.createElement("div");
  top.className="item-top";

  const name=document.createElement("span");
  name.className="domain";
  name.textContent=domain;

  const status=document.createElement("span");
  status.className="status unknown";
  status.textContent="NÃO TESTADO";

  const actions=document.createElement("div");
  actions.className="actions";

  const btn=document.createElement("button");
  btn.textContent="GET / TESTAR";
  btn.onclick=()=>testSite(domain);

  actions.appendChild(btn);
  top.append(name,status);
  div.append(top,actions);
  fragment.appendChild(div);
 });

 $("results").appendChild(fragment);
 $("shown").textContent=visible;
 $("more").style.display=visible<domains.length?"block":"none";
}

function render(){
 const term=$("filter").value.toLowerCase();

 document.querySelectorAll(".item").forEach(el=>{
  const name=el.querySelector(".domain").textContent;
  el.style.display=name.toLowerCase().includes(term)?"block":"none";
 });
}

async function getURL(domain){
 const mode=$("mode").value;
 const target="https://"+domain+"/";
 if(mode==="proxy"){
  return $("proxy").value+encodeURIComponent(target);
 }
 return target;
}

async function testSite(domain){
 const items=[...document.querySelectorAll(".item")];
 const item=items.find(x=>x.querySelector(".domain").textContent===domain);
 if(!item)return;

 const status=item.querySelector(".status");
 status.className="status unknown";
 status.textContent="TESTANDO...";

 const mode=$("mode").value;

 try{
  const url=await getURL(domain);
  const response=await fetch(url,{
   method:"GET",
   mode:mode==="opaque"?"no-cors":"cors",
   cache:"no-store",
   redirect:"follow"
  });

  tested++;
  $("tested").textContent=tested;

  if(response.type==="opaque"){
   status.textContent="RESPOSTA OPACA";
   status.className="status unknown";
   results[domain]={status:"OPACO"};
   return;
  }

  const body=await response.text();
  const code=response.status;

  results[domain]={
   status:code,
   html:body,
   url:response.url
  };

  status.textContent=code+" "+response.statusText;
  status.className="status "+(response.ok?"ok":"bad");

  if(response.ok){
   const previewBtn=document.createElement("button");
   previewBtn.textContent="VER CÓDIGO / PREVIEW";
   previewBtn.onclick=()=>openPreview(domain);
   item.querySelector(".actions").appendChild(previewBtn);
  }

 }catch(e){
  status.textContent="ERRO DE REDE / CORS";
  status.className="status bad";
  results[domain]={status:"ERRO",error:e.message};
 }
}

async function testAll(){
 if(testing)return;
 testing=true;

 const pending=domains.filter(d=>!results[d]);

 for(let i=0;i<pending.length;i+=5){
  await Promise.all(
   pending.slice(i,i+5).map(testSite)
  );
 }

 testing=false;
}

function openPreview(domain){
 const result=results[domain];
 if(!result || !result.html)return;

 $("previewTitle").textContent=domain+" — 200 OK";
 $("preview").style.display="block";
 $("source").value=result.html;
 showVisual();
}

function showSource(){
 $("frame").style.display="none";
 $("source").style.display="block";
}

function showVisual(){
 $("source").style.display="none";
 $("frame").style.display="block";
 $("frame").srcdoc=$("source").value;
}

function closePreview(){
 $("preview").style.display="none";
 $("frame").srcdoc="";
}

function exportResults(){
 const content=Object.entries(results)
  .map(([domain,r])=>domain+" | "+r.status)
  .join("\n");

 const blob=new Blob([content],{type:"text/plain"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="resultados.txt";
 a.click();
 URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
