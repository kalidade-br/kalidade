<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>Metal Slug</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    #loading.hidden {
      display: none;
    }

    #loadingText {
      opacity: .7;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div id="loading">
    <div id="loadingText">
      Carregando...
    </div>
  </div>


  <script>

    /*
    ========================================================
    ARQUIVOS
    ========================================================
    */

    const BIOS =
      "/scph1001-us.bin";

    const ROM =
      "/metal-slug-x.bin";


    /*
    ========================================================
    EMULATORJS
    ========================================================
    */

    const DATA =
      "https://cdn.emulatorjs.org/stable/data/";


    /*
    ========================================================
    CONFIGURAÇÃO
    ========================================================
    */

    window.EJS_player =
      "#game";

    window.EJS_core =
      "psx";

    window.EJS_gameName =
      "Metal Slug X";

    window.EJS_biosUrl =
      BIOS;

    window.EJS_gameUrl =
      ROM;

    window.EJS_pathtodata =
      DATA;

    window.EJS_startOnLoaded =
      true;

    window.EJS_askBeforeExit =
      false;

    window.EJS_browserMode =
      "auto";


    /*
    ========================================================
    OCULTAR TELA DE CARREGAMENTO
    ========================================================
    */

    const loading =
      document.getElementById("loading");

    const observer =
      new MutationObserver(() => {

        /*
        Depois que o EmulatorJS começar,
        a tela preta inicial desaparece.
        */

        setTimeout(() => {

          loading.classList.add("hidden");

        }, 1200);

      });

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );


    /*
    ========================================================
    CARREGAR EMULATORJS
    ========================================================
    */

    const script =
      document.createElement("script");

    script.src =
      DATA + "loader.js";

    script.onload = () => {

      setTimeout(() => {

        loading.classList.add("hidden");

      }, 1800);

    };

    document.body.appendChild(script);

  </script>

</body>
</html>
