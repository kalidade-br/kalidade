<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALIDADE INVERTER TEXTO</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --cyan: #00f7ff;
    --blue: #0066ff;
    --purple: #a000ff;
    --pink: #ff00cc;
    --bg: #03050b;
    --card: rgba(8, 12, 25, .84);
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 15% 10%,
            rgba(0,247,255,.14),
            transparent 30%),
        radial-gradient(circle at 85% 85%,
            rgba(160,0,255,.14),
            transparent 30%),
        var(--bg);

    overflow-x: hidden;
}

/* FUNDO */

body::before,
body::after {
    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    filter: blur(110px);

    opacity: .17;

    z-index: -1;

    animation: float 8s ease-in-out infinite alternate;
}

body::before {
    background: var(--cyan);
    top: -160px;
    left: -160px;
}

body::after {
    background: var(--purple);
    right: -160px;
    bottom: -160px;

    animation-delay: 2s;
}

@keyframes float {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(80px, 50px);
    }
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 5px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 25px 5px 30px;

    animation: fadeDown .7s ease;
}

.logo {
    font-size: clamp(30px, 9vw, 60px);

    font-weight: 900;

    letter-spacing: 3px;

    color: white;

    text-shadow:
        0 0 5px var(--cyan),
        0 0 15px var(--cyan),
        0 0 30px var(--cyan),
        0 0 60px var(--blue);

    animation: neonPulse 2.5s ease-in-out infinite alternate;
}

@keyframes neonPulse {
    from {
        filter: brightness(.9);
    }

    to {
        filter: brightness(1.25);
    }
}

.subtitle {
    margin-top: 8px;

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;
}

/* CARD */

.card {
    position: relative;

    background: var(--card);

    border: 1px solid rgba(0,247,255,.42);

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 20px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 15px rgba(0,247,255,.12),
        inset 0 0 30px rgba(0,247,255,.025);

    overflow: hidden;

    animation: cardIn .7s ease both;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
    );

    animation: scan 4s linear infinite;
}

@keyframes scan {
    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }
}

/* TÍTULO */

.card-title {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.icon {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: rgba(0,247,255,.08);

    border: 1px solid rgba(0,247,255,.5);

    color: var(--cyan);

    font-size: 20px;

    box-shadow:
        0 0 10px rgba(0,247,255,.2);
}

.card-title h2 {
    margin: 0;
    font-size: 20px;
}

.card-title span {
    display: block;

    margin-top: 3px;

    color: var(--cyan);

    font-size: 12px;
}

/* TEXTAREA */

textarea {
    width: 100%;

    min-height: 150px;

    resize: vertical;

    background: rgba(0,0,0,.48);

    color: white;

    border: 1px solid #252b3c;

    border-radius: 13px;

    padding: 15px;

    outline: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 16px;

    line-height: 1.5;

    transition: .25s;
}

textarea:focus {
    border-color: var(--cyan);

    box-shadow:
        0 0 10px rgba(0,247,255,.25),
        inset 0 0 15px rgba(0,247,255,.04);
}

textarea::placeholder {
    color: #596070;
}

/* BOTÕES */

.buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 12px;
}

button {
    border: 0;

    border-radius: 11px;

    padding: 13px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

button:active {
    transform: scale(.96);
}

.invert-btn {
    background: var(--cyan);

    color: #001014;

    box-shadow:
        0 0 8px var(--cyan),
        0 0 20px rgba(0,247,255,.3);
}

.invert-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 12px var(--cyan),
        0 0 35px rgba(0,247,255,.5);
}

.clear-btn {
    background: transparent;

    border: 1px solid #ff3bba;

    color: #ff65c9;
}

.clear-btn:hover {
    background: rgba(255,0,180,.08);

    box-shadow:
        0 0 15px rgba(255,0,180,.3);
}

/* RESULTADO */

.result-label {
    margin-top: 18px;

    margin-bottom: 7px;

    color: #737b8c;

    font-size: 12px;

    letter-spacing: 2px;
}

.result {
    min-height: 80px;

    background: rgba(0,0,0,.55);

    border: 1px solid #252b3c;

    border-radius: 12px;

    padding: 15px;

    color: var(--cyan);

    font-size: 17px;

    word-break: break-word;

    line-height: 1.6;

    white-space: pre-wrap;

    transition: .3s;
}

.result.show {
    border-color: var(--cyan);

    box-shadow:
        0 0 12px rgba(0,247,255,.15);

    animation: resultPop .3s ease;
}

@keyframes resultPop {
    from {
        opacity: .4;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* COPIAR */

.copy-btn {
    width: 100%;

    margin-top: 10px;

    background: transparent;

    border: 1px solid #263344;

    color: #9ba6b9;
}

.copy-btn:hover {
    color: white;

    border-color: var(--cyan);

    box-shadow:
        0 0 10px rgba(0,247,255,.2);
}

/* INFO */

.info {
    text-align: center;

    color: #727b8d;

    font-size: 12px;

    line-height: 1.8;

    margin: 25px 0;
}

.info span {
    color: var(--cyan);
}

/* MOBILE */

@media(max-width:600px) {

    .container {
        padding: 5px;
    }

    .card {
        padding: 15px;

        border-radius: 16px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    textarea {
        min-height: 120px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            KALIDADE
        </div>

        <div class="subtitle">
            INVERTER TEXTO
        </div>

    </header>


    <!-- PAINEL -->

    <section class="card">

        <div class="card-title">

            <div class="icon">
                🔄
            </div>

            <div>
                <h2>Inverter Texto</h2>
                <span>Texto → Texto invertido</span>
            </div>

        </div>


        <textarea
            id="inputText"
            placeholder="Digite seu texto aqui...

Exemplo:
KALIDADE
Olá mundo!"
        ></textarea>


        <div class="buttons">

            <button
                class="invert-btn"
                onclick="invertText()"
            >
                ⚡ INVERTER TEXTO
            </button>

            <button
                class="clear-btn"
                onclick="clearText()"
            >
                ✕ LIMPAR
            </button>

        </div>


        <div class="result-label">
            RESULTADO
        </div>


        <div
            class="result"
            id="result"
        >
            Aguardando texto...
        </div>


        <button
            class="copy-btn"
            onclick="copyResult()"
        >
            📋 COPIAR RESULTADO
        </button>

    </section>


    <div class="info">

        KALIDADE <span>•</span> INVERTER TEXTO

        <br>

        O texto será invertido
        <span>caractere por caractere</span>.

    </div>

</div>


<script>

/* =========================
   INVERTER TEXTO
========================= */

function invertText() {

    const input =
        document
        .getElementById("inputText")
        .value;

    if (!input) {

        showResult(
            "Digite algum texto."
        );

        return;
    }

    /*
     * Array.from funciona melhor
     * com caracteres Unicode,
     * incluindo emojis.
     */

    const resultado =
        Array.from(input)
        .reverse()
        .join("");

    showResult(resultado);
}


/* =========================
   MOSTRAR RESULTADO
========================= */

function showResult(text) {

    const result =
        document.getElementById("result");

    result.textContent =
        text;

    result.classList.remove("show");

    void result.offsetWidth;

    result.classList.add("show");
}


/* =========================
   COPIAR
========================= */

async function copyResult() {

    const text =
        document
        .getElementById("result")
        .textContent;

    if (
        !text ||
        text === "Aguardando texto..." ||
        text === "Digite algum texto."
    ) {
        return;
    }

    try {

        await navigator.clipboard
            .writeText(text);

        alert("✓ Texto copiado!");

    } catch {

        const temp =
            document.createElement("textarea");

        temp.value = text;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        alert("✓ Texto copiado!");
    }
}


/* =========================
   LIMPAR
========================= */

function clearText() {

    document
        .getElementById("inputText")
        .value = "";

    showResult(
        "Aguardando texto..."
    );
}

</script>

</body>
  </html>
