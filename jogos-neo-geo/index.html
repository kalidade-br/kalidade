<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Geo - MTSLUG</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: #eee; font-family: system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #game { flex: 1; min-height: 0; }
  #setup { padding: 24px; max-width: 520px; margin: auto; text-align: center; display: none; }
  #setup label { display: block; margin: 14px 0 4px; font-size: 14px; opacity: .8; }
  #setup input { width: 100%; box-sizing: border-box; }
  button { margin-top: 18px; padding: 12px 22px; font-size: 16px; border: 0; border-radius: 8px; background: #e63946; color: #fff; }
  #msg { margin-top: 12px; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>

  <div id="setup">
    <h2>Neo Geo</h2>
    <p id="msg"></p>
    <label>ROM do jogo (ex: kof2002.zip)</label>
    <input type="file" id="romInput" accept=".zip,.7z,.neo">
    <label>BIOS (neogeo.zip)</label>
    <input type="file" id="biosInput" accept=".zip">
    <button id="startBtn">Iniciar</button>
  </div>
</div>

<script>
  // ===== CONFIGURAÇÃO =====
  // Nome dos arquivos que estão na MESMA pasta deste index.html
  const GAME_FILE = "mslug.zip";   // ajuste se o nome do seu arquivo for diferente
  const BIOS_FILE = "neogeo.zip";    // BIOS do Neo Geo
  const CORE      = "arcade";        // core FBNeo/MAME do EmulatorJS (arcade = Neo Geo)
  // ========================

  const $ = id => document.getElementById(id);

  function startEmulator(gameUrl, gameName, biosUrl) {
    $("setup").style.display = "none";
    window.EJS_player = "#game";
    window.EJS_core = CORE;
    window.EJS_gameUrl = gameUrl;
    window.EJS_gameName = gameName.replace(/\.[^.]+$/, "");
    if (biosUrl) window.EJS_biosUrl = biosUrl;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_color = "#e63946";
    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    document.body.appendChild(s);
  }

  function showSetup(text) {
    $("msg").textContent = text;
    $("setup").style.display = "block";
  }

  async function exists(url) {
    try { const r = await fetch(url, { method: "HEAD" }); return r.ok; }
    catch { return false; }
  }

  (async () => {
    if (location.protocol === "file:") {
      showSetup("Abra via servidor local (ex: python -m http.server) para carregar automaticamente, ou escolha os arquivos abaixo.");
      return;
    }
    if (await exists(GAME_FILE)) {
      const hasBios = await exists(BIOS_FILE);
      startEmulator(GAME_FILE, GAME_FILE, hasBios ? BIOS_FILE : null);
    } else {
      showSetup("Não encontrei " + GAME_FILE + " na pasta. Escolha os arquivos abaixo.");
    }
  })();

  $("startBtn").onclick = () => {
    const rom = $("romInput").files[0];
    const bios = $("biosInput").files[0];
    if (!rom) { $("msg").textContent = "Selecione a ROM do jogo."; return; }
    startEmulator(URL.createObjectURL(rom), rom.name, bios ? URL.createObjectURL(bios) : null);
  };
</script>
</body>
</html>
