
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - KALIDADE-BR</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #202124;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  overflow-wrap: anywhere;
}

.container {
  width: 100%;
  max-width: 1000px;
  text-align: center;
}

.logo {
  font-size: clamp(38px, 10vw, 110px);
  font-weight: 800;
  letter-spacing: -0.07em;
  line-height: 1.1;
  margin-bottom: 25px;
  color: #202124;
}

.logo span {
  color: #4285f4;
}

.error {
  font-size: clamp(100px, 27vw, 280px);
  font-weight: 800;
  letter-spacing: -0.08em;
  line-height: 0.95;
  color: #202124;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(20px, 4vw, 34px);
  font-weight: 500;
  margin-bottom: 18px;
}

.description {
  color: #5f6368;
  font-size: clamp(14px, 2vw, 17px);
  line-height: 1.7;
  max-width: 600px;
  margin: 0 auto;
}

.url {
  color: #1a73e8;
  margin-top: 12px;
  font-size: 14px;
  word-break: break-all;
}

.buttons {
  margin-top: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 25px;
  padding: 13px 23px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

.back {
  color: white;
  background: #1a73e8;
}

.back:hover {
  background: #1558b0;
}

.home {
  color: #202124;
  background: #f1f3f4;
}

.home:hover {
  background: #e3e5e6;
}

.footer {
  margin-top: 45px;
  font-size: 12px;
  color: #9aa0a6;
  letter-spacing: 2px;
}

@media (max-width: 480px) {
  body {
    padding: 18px;
  }

  .logo {
    letter-spacing: -0.06em;
    margin-bottom: 35px;
  }

  .error {
    margin-bottom: 25px;
  }

  .buttons {
    flex-direction: column;
  }

  button {
    width: 100%;
    max-width: 280px;
  }

  .footer {
    margin-top: 35px;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo">
    KALIDADE<span>-BR</span>
  </div>

  <div class="error">404</div>

  <h1>Página não encontrada</h1>

  <p class="description">
    O endereço que você tentou acessar não existe
    ou pode ter sido removido.
    Verifique o endereço e tente novamente.
  </p>

  <p class="url" id="url"></p>

  <div class="buttons">
    <button class="back" onclick="history.back()">
      Voltar
    </button>

    <button class="home" onclick="location.href='/'">
      Página inicial
    </button>
  </div>

  <div class="footer">
    KALIDADE-BR · ERROR 404
  </div>

</main>

<script>
document.getElementById("url").textContent =
  window.location.pathname;
</script>

</body>
</html>
