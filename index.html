<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEB-BR — Ferramentas e Utilitários Open Source</title>

<meta name="description"
      content="WEB-BR reúne ferramentas, utilitários e projetos open source para desenvolvedores e usuários da web.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://web-brasil.vercel.app/">

<meta property="og:title" content="WEB-BR — Ferramentas e Utilitários">
<meta property="og:description" content="Ferramentas e utilitários open source da WEB-BR.">
<meta property="og:url" content="https://web-brasil.vercel.app/">
<meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #f0f0f5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
            animation: float 18s ease-in-out infinite;
        }
        .bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(168,85,247,0.06) 0%, transparent 70%);
            animation: float 22s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .wrap {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 60px 0 30px;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(0,212,255,0.3);
            object-fit: cover;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(0,212,255,0.15);
        }
        .user-name {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 8px;
        }
        .user-name .at { color: #8a8a9a; }
        .user-name .name { color: #00d4ff; }
        .user-desc {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #8a8a9a;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: #f0f0f5;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .github-btn:hover {
            background: rgba(0,212,255,0.1);
            border-color: rgba(0,212,255,0.3);
            transform: translateY(-2px);
        }
        .github-btn svg { width: 22px; height: 22px; }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0 40px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-num {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 800;
            color: #f0f0f5;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #5a5a6a;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        /* ===== SEARCH ===== */
        .search-box {
            position: relative;
            max-width: 700px;
            margin: 0 auto 30px;
        }
        .search-box input {
            width: 100%;
            padding: 18px 24px 18px 56px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: #f0f0f5;
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-box input::placeholder { color: #5a5a6a; }
        .search-box input:focus {
            border-color: #00d4ff;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 4px rgba(0,212,255,0.08);
        }
        .search-box svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: #5a5a6a;
            pointer-events: none;
        }

        /* ===== TAGS ===== */
        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .tag {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 100px;
            color: #8a8a9a;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }
        .tag:hover {
            border-color: rgba(255,255,255,0.2);
            color: #f0f0f5;
        }
        .tag.active {
            background: rgba(0,212,255,0.1);
            border-color: rgba(0,212,255,0.3);
            color: #00d4ff;
        }

        /* ===== GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        /* ===== CARD ===== */
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: enter 0.5s ease forwards;
        }
        @keyframes enter {
            to { opacity: 1; transform: translateY(0); }
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .card:hover::before { transform: scaleX(1); }
        .card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 0 50px rgba(0,212,255,0.08), 0 20px 40px rgba(0,0,0,0.3);
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }
        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            position: relative;
            overflow: hidden;
        }
        .card-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 100%);
        }
        .card-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .card-lang {
            font-size: 0.85rem;
            color: #5a5a6a;
            background: rgba(255,255,255,0.04);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
        .card-stars {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: #5a5a6a;
            font-weight: 600;
        }

        .card-body { flex: 1; }
        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #f0f0f5;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }
        .card-desc {
            font-size: 1rem;
            color: #8a8a9a;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-tag {
            font-size: 0.8rem;
            color: #5a5a6a;
            background: rgba(255,255,255,0.03);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.06);
            font-weight: 500;
        }
        .card-link {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #00d4ff;
            opacity: 0.6;
            transition: opacity 0.3s;
            font-weight: 600;
        }
        .card:hover .card-link { opacity: 1; }

        /* ===== SKELETON ===== */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: skel 1.5s infinite;
            border-radius: 10px;
        }
        @keyframes skel {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skel-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 28px;
            height: 220px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .skel-icon { width: 52px; height: 52px; border-radius: 14px; }
        .skel-title { width: 55%; height: 24px; }
        .skel-line { width: 100%; height: 18px; }
        .skel-line.short { width: 45%; }

        /* ===== EMPTY ===== */
        .empty {
            text-align: center;
            padding: 100px 20px;
            color: #5a5a6a;
            grid-column: 1 / -1;
        }
        .empty svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty h3 {
            color: #8a8a9a;
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .empty p { font-size: 1.05rem; }

        /* ===== ERROR ===== */
        .error {
            text-align: center;
            padding: 80px 20px;
            max-width: 600px;
            margin: 0 auto;
            grid-column: 1 / -1;
        }
        .error h3 {
            color: #ec4899;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        .retry {
            margin-top: 24px;
            padding: 14px 32px;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 14px;
            color: #00d4ff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .retry:hover {
            background: rgba(0,212,255,0.15);
            transform: translateY(-2px);
        }

        /* ===== IFRAME ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(16px);
            z-index: 9999;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .overlay.active {
            display: flex;
            opacity: 1;
        }
        .overlay-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(10,10,15,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            gap: 16px;
        }
        .overlay-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .overlay-fav {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }
        .overlay-url {
            font-size: 0.95rem;
            color: #8a8a9a;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .overlay-btns {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .obtn {
            padding: 8px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #8a8a9a;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .obtn:hover {
            background: rgba(255,255,255,0.1);
            color: #f0f0f5;
            border-color: rgba(255,255,255,0.2);
        }
        .obtn.close:hover {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.3);
            color: #ef4444;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 40px 0 80px;
            color: #5a5a6a;
            font-size: 1rem;
            font-weight: 500;
        }
        .footer a {
            color: #00d4ff;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .footer a:hover { opacity: 1; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header { padding: 40px 0 20px; }
            .avatar { width: 120px; height: 120px; }
            .stats { gap: 24px; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
            .card { padding: 22px; }
            .card-icon { width: 48px; height: 48px; font-size: 1.1rem; }
            .card-title { font-size: 1.2rem; }
            .card-desc { font-size: 0.95rem; }
            .overlay-head { padding: 12px 16px; }
            .overlay-url { font-size: 0.8rem; max-width: 120px; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="wrap">
        <header class="header">
            <img src="https://avatars.githubusercontent.com/u/286726470?v=4" alt="web-br" class="avatar" id="avatar">
            <div class="user-name">
                <span class="at">@</span><span class="name" id="userName">web-br</span>
            </div>
            <p class="user-desc" id="userDesc">Ferramentas e utilitários open source</p>
            <a href="https://github.com/web-br" target="_blank" class="github-btn" id="githubBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                GitHub
            </a>

            <div class="stats" id="statsBar">
                <div class="stat"><div class="stat-num" id="statRepos">—</div><div class="stat-label">Repositórios</div></div>
                <div class="stat"><div class="stat-num" id="statLangs">—</div><div class="stat-label">Linguagens</div></div>
                <div class="stat"><div class="stat-num" id="statUpdated">—</div><div class="stat-label">Atualizado</div></div>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar repositório, tag ou linguagem..." autocomplete="off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>

        <div class="tags" id="filterTags"></div>

        <div class="grid" id="toolsGrid">
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
            <div class="skel-card"><div class="skeleton skel-icon"></div><div class="skeleton skel-title"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>
        </div>

        <footer class="footer">
            <p><a href="https://github.com/web-br" target="_blank">web-br</a> · Dados via GitHub API · <span id="fetchTime"></span></p>
        </footer>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
        <div class="overlay-head">
            <div class="overlay-info">
                <div class="overlay-fav" id="oFav">W</div>
                <span class="overlay-url" id="oUrl">https://web-br.github.io/</span>
            </div>
            <div class="overlay-btns">
                <a href="#" class="obtn" id="oOpen" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Abrir
                </a>
                <button class="obtn close" onclick="closeOverlay()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Fechar
                </button>
            </div>
        </div>
        <iframe id="toolFrame" src="" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script>
        const API_URL = 'https://api.github.com/users/web-br/repos?per_page=100&sort=updated';
        const INFO_URL = './info.json';
        const BASE_URL = 'https://web-br.github.io/';
        const GITHUB_URL = 'https://github.com/web-br';

        let allRepos = [];
        let infoData = {};
        let currentFilter = 'all';

        const langIcons = {
            'HTML': '🌐', 'CSS': '🎨', 'JavaScript': '⚡', 'TypeScript': '🔷',
            'PHP': '🐘', 'Python': '🐍', 'Java': '☕', 'Ruby': '💎',
            'Go': '🔵', 'Rust': '⚙️', 'C': '🔧', 'C++': '🔧', 'C#': '🔧',
            'Shell': '🐚', 'Swift': '🍎', 'Kotlin': '🟣', 'Vue': '💚', 'React': '⚛️'
        };

        const catGradients = {
            'Utilitários': 'linear-gradient(135deg, #00d4ff, #0891b2)',
            'Infraestrutura': 'linear-gradient(135deg, #a855f7, #7c3aed)',
            'Redes Sociais': 'linear-gradient(135deg, #ec4899, #db2777)',
            'Emuladores': 'linear-gradient(135deg, #f97316, #ea580c)',
            'Streaming': 'linear-gradient(135deg, #ef4444, #dc2626)',
            'Entretenimento': 'linear-gradient(135deg, #8b5cf6, #6d28d9)',
            'Fiscal': 'linear-gradient(135deg, #22c55e, #16a34a)',
            'Loja': 'linear-gradient(135deg, #06b6d4, #0891b2)',
            'Produtividade': 'linear-gradient(135deg, #14b8a6, #0d9488)',
            'Repositório': 'linear-gradient(135deg, #6366f1, #4f46e5)',
            'default': 'linear-gradient(135deg, #00d4ff, #a855f7)'
        };

        async function init() {
            try {
                const [apiRes, infoRes] = await Promise.allSettled([
                    fetch(API_URL),
                    fetch(INFO_URL)
                ]);

                if (infoRes.status === 'fulfilled' && infoRes.value.ok) {
                    infoData = await infoRes.value.json();
                } else {
                    infoData = {};
                }

                if (apiRes.status === 'fulfilled' && apiRes.value.ok) {
                    allRepos = await apiRes.value.json();
                    allRepos.sort((a, b) => {
                        const aHasInfo = infoData[a.name] ? 1 : 0;
                        const bHasInfo = infoData[b.name] ? 1 : 0;
                        if (aHasInfo !== bHasInfo) return bHasInfo - aHasInfo;
                        return a.name.localeCompare(b.name);
                    });
                } else {
                    throw new Error('Falha ao carregar repositórios');
                }

                updateStats();
                renderTags();
                renderTools();
                document.getElementById('fetchTime').textContent = new Date().toLocaleString('pt-BR');

            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function updateStats() {
            document.getElementById('statRepos').textContent = allRepos.length;
            const langs = [...new Set(allRepos.map(r => r.language).filter(Boolean))];
            document.getElementById('statLangs').textContent = langs.length;
            const lastUpdated = allRepos.length > 0
                ? new Date(Math.max(...allRepos.map(r => new Date(r.updated_at)))).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })
                : '—';
            document.getElementById('statUpdated').textContent = lastUpdated;
        }

        function renderTags() {
            const categories = new Set();
            allRepos.forEach(repo => {
                const info = infoData[repo.name];
                if (info?.category) categories.add(info.category);
            });
            const container = document.getElementById('filterTags');
            const tags = ['all', ...Array.from(categories).sort()];
            container.innerHTML = tags.map(tag => `
                <button class="tag ${tag === 'all' ? 'active' : ''}" data-tag="${tag}" onclick="setFilter('${tag}')">
                    ${tag === 'all' ? 'Todos' : tag}
                </button>
            `).join('');
        }

        function setFilter(tag) {
            currentFilter = tag;
            document.querySelectorAll('.tag').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tag === tag);
            });
            renderTools();
        }

        function getRepoInfo(repo) {
            const info = infoData[repo.name];
            const title = info?.title || repo.name;
            const description = info?.description || repo.description || 'Repositório web-br/' + repo.name;
            const category = info?.category || 'Geral';
            const tags = info?.tags || [];
            const icon = info?.icon || repo.name.charAt(0).toUpperCase();
            const gradient = catGradients[category] || catGradients['default'];
            const langIcon = langIcons[repo.language] || '📄';
            return { title, description, category, tags, icon, gradient, langIcon };
        }

        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allRepos.filter(repo => {
                const info = getRepoInfo(repo);
                const matchesSearch = !search ||
                    repo.name.toLowerCase().includes(search) ||
                    info.title.toLowerCase().includes(search) ||
                    info.description.toLowerCase().includes(search) ||
                    info.tags.some(t => t.toLowerCase().includes(search)) ||
                    (repo.language || '').toLowerCase().includes(search);
                const matchesCategory = currentFilter === 'all' || info.category === currentFilter;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <h3>Nenhum resultado encontrado</h3>
                        <p>Tente outro termo de busca ou categoria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((repo, i) => {
                const info = getRepoInfo(repo);
                const url = repo.homepage || (BASE_URL + repo.name);
                const stars = repo.stargazers_count || 0;
                const delay = i * 0.05;

                return `
                    <div class="card" onclick="openTool('${repo.name}', '${url}')" style="animation-delay: ${delay}s">
                        <div class="card-head">
                            <div class="card-icon" style="background: ${info.gradient}">${info.icon}</div>
                            <div class="card-meta">
                                ${repo.language ? `<span class="card-lang">${info.langIcon} ${repo.language}</span>` : ''}
                                ${stars > 0 ? `<span class="card-stars">⭐ ${stars}</span>` : ''}
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${info.title}</div>
                            <div class="card-desc">${info.description}</div>
                        </div>
                        <div class="card-foot">
                            <div class="card-tags">
                                <span class="card-tag">${info.category}</span>
                                ${info.tags.slice(0, 2).map(t => `<span class="card-tag">${t}</span>`).join('')}
                            </div>
                            <div class="card-link">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                Abrir
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openTool(name, url) {
            const overlay = document.getElementById('overlay');
            const frame = document.getElementById('toolFrame');
            document.getElementById('oUrl').textContent = url;
            document.getElementById('oFav').textContent = name.charAt(0).toUpperCase();
            document.getElementById('oOpen').href = url;
            frame.src = url;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            const overlay = document.getElementById('overlay');
            const frame = document.getElementById('toolFrame');
            overlay.classList.remove('active');
            setTimeout(() => { frame.src = ''; }, 300);
            document.body.style.overflow = '';
        }

        function showError(msg) {
            document.getElementById('toolsGrid').innerHTML = `
                <div class="error">
                    <h3>⚠️ ${msg}</h3>
                    <p>Verifique sua conexão ou tente novamente mais tarde.</p>
                    <button class="retry" onclick="location.reload()">🔄 Tentar novamente</button>
                </div>
            `;
        }

        document.getElementById('searchInput').addEventListener('input', renderTools);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeOverlay();
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        document.getElementById('overlay').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeOverlay();
        });

        init();
    </script>
</body>
</html>
