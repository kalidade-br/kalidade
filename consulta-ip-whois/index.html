<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALIDADE IP WHOIS</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2630;--muted:#667585;--line:#e1e6eb;--brand:#1f6feb;--ok:#1a8f4c;--warn:#d98a00;--bad:#d1322f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--text:#e6ebf0;--muted:#8d9ba9;--line:#263140;--brand:#4c8dff;--ok:#3ecf7e;--warn:#f0a93a;--bad:#ff6b66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo b{color:var(--brand)}
nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:14px}
nav a:hover{color:var(--brand)}
.hero{padding:36px 0 20px;text-align:center}
.hero h1{margin:0 0 6px;font-size:28px}
.hero p{margin:0;color:var(--muted)}
.myip{margin:22px auto 0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:560px}
.myip small{color:var(--muted)}
.myip .ip{font-size:32px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
form{display:flex;gap:8px;max-width:560px;margin:18px auto 0}
input{flex:1;min-width:0;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
button{padding:12px 20px;font-size:15px;font-weight:600;border:0;border-radius:6px;background:var(--brand);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#out{padding-bottom:40px}
.msg{max-width:560px;margin:18px auto 0;text-align:center;color:var(--muted)}
.msg.err{color:var(--bad)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card h2{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--brand) 6%,var(--card))}
.card.full{grid-column:1/-1}
dl{margin:0;padding:6px 16px 10px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-weight:600;word-break:break-word}
.yes{color:var(--bad)}.no{color:var(--ok)}
.sig{padding:12px 16px;border-bottom:1px solid var(--line)}
.sig:last-child{border:0}
.sig span{color:var(--muted);display:block;font-size:14px}
.aviso{margin-top:16px;color:var(--muted);font-size:13px;text-align:center}
footer{border-top:1px solid var(--line);padding:18px 0;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:480px){form{flex-direction:column}.myip .ip{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">KALIDADE <b>IP WHOIS</b></div>
  <nav><a href="#">Início</a><a href="#consulta">Consultar IP</a></nav>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Consulta de IP e WHOIS</h1>
    <p>Veja provedor, localização e risco de qualquer endereço IP.</p>
    <div class="myip">
      <small>Seu endereço IP</small>
      <div class="ip" id="myip">Detectando...</div>
    </div>
    <form id="f">
      <input id="ip" placeholder="Digite um IP, ex.: 9.9.9.9" autocomplete="off" inputmode="text" aria-label="Endereço IP">
      <button id="btn" type="submit">Consultar</button>
      <button id="clr" type="button" class="sec">Limpar</button>
    </form>
  </section>
  <div id="consulta"></div>
  <section id="out" aria-live="polite"></section>
</main>

<footer>KALIDADE IP WHOIS &mdash; a classificação é uma estimativa.</footer>

<script>
var API="https://api-kalidade.vercel.app/api/ip.js?ip=";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"-":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function row(k,v){return "<div><dt>"+k+"</dt><dd>"+v+"</dd></div>"}
function bool(b){return b?'<span class="yes">Sim</span>':'<span class="no">Não</span>'}
function cor(p){return p>=60?"var(--bad)":p>=25?"var(--warn)":"var(--ok)"}

function render(d){
  var c=d.consulta||{},p=d.provedor||{},l=d.localizacao||{},s=d.sinais||[];
  var h='<div class="grid">';
  h+='<div class="card"><h2>Resultado da consulta</h2><dl>'+
    row("IP",esc(c.ip))+
    row("Classificação",'<span class="badge" style="background:'+cor(c.pontuacao_risco)+'">'+esc(c.classificacao)+'</span>')+
    row("Pontuação de risco",esc(c.pontuacao_risco)+" / 100")+
    row("Confiança",Math.round((c.confianca||0)*100)+"%")+
    row("VPN",bool(c.vpn))+row("Proxy",bool(c.proxy))+'</dl></div>';
  h+='<div class="card"><h2>Provedor</h2><dl>'+
    row("Nome",esc(p.nome))+row("Organização",esc(p.organizacao))+row("ASN",esc(p.asn))+
    row("Faixa de IP",esc(p.faixa_ip))+row("Responsável",esc(p.responsavel))+'</dl></div>';
  h+='<div class="card"><h2>Localização</h2><dl>'+
    row("País",esc(l.pais)+(l.codigo_pais?" ("+esc(l.codigo_pais)+")":""))+
    row("Cidade",esc(l.cidade))+row("Latitude",esc(l.latitude))+row("Longitude",esc(l.longitude))+
    (l.latitude!=null?row("Mapa",'<a href="https://www.google.com/maps?q='+encodeURIComponent(l.latitude+","+l.longitude)+'" target="_blank" rel="noopener">Abrir no mapa</a>'):"")+'</dl></div>';
  h+='<div class="card"><h2>Sinais detectados</h2>';
  h+=s.length?s.map(function(x){return '<div class="sig"><b>'+esc(x.tipo)+'</b> &mdash; '+(x.detectado?"detectado":"não detectado")+' (peso '+esc(x.peso)+')<span>'+esc(x.descricao)+'</span></div>'}).join(""):'<div class="sig"><span>Nenhum sinal encontrado.</span></div>';
  h+='</div></div>';
  h+='<p class="aviso">'+esc(d.aviso||"")+(d.identificador?" Identificador: "+esc(d.identificador):"")+'</p>';
  $("out").innerHTML=h;
}

function consultar(ip){
  ip=(ip||"").trim();
  if(!ip){$("out").innerHTML='<p class="msg err">Digite um endereço IP para consultar.</p>';return}
  $("btn").disabled=true;
  $("out").innerHTML='<p class="msg">Consultando '+esc(ip)+'...</p>';
  fetch(API+encodeURIComponent(ip))
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.sucesso)render(d);
      else $("out").innerHTML='<p class="msg err">'+esc((d&&(d.erro||d.mensagem))||"Não foi possível consultar este IP. Confira o endereço e tente de novo.")+'</p>';
    })
    .catch(function(){$("out").innerHTML='<p class="msg err">Falha ao acessar a API. Verifique sua conexão e tente de novo.</p>'})
    .then(function(){$("btn").disabled=false});
}

$("f").addEventListener("submit",function(e){e.preventDefault();consultar($("ip").value)});

$("clr").addEventListener("click",function(){
  $("ip").value="";$("out").innerHTML="";$("ip").focus();
});

var FONTES=[
  ["https://api.ipify.org?format=json",function(d){return d.ip}],
  ["https://api64.ipify.org?format=json",function(d){return d.ip}],
  ["https://ipwho.is/",function(d){return d.ip}],
  ["https://www.cloudflare.com/cdn-cgi/trace",null]
];
function detectar(i){
  if(i>=FONTES.length){
    $("myip").textContent="Não detectado";
    $("out").innerHTML='<p class="msg">Não foi possível detectar seu IP. Digite um IP acima e clique em Consultar.</p>';
    $("ip").focus();return;
  }
  var f=FONTES[i];
  fetch(f[0]).then(function(r){return f[1]?r.json():r.text()}).then(function(d){
    var ip=f[1]?f[1](d):((d.match(/^ip=(.+)$/m)||[])[1]||"").trim();
    if(!ip)throw 0;
    $("myip").textContent=ip;$("ip").value=ip;consultar(ip);
  }).catch(function(){detectar(i+1)});
}
detectar(0);
</script>

  </script>

    <script>
(function () {
  if (location.hostname !== "kalidade.vercel.app") return;

  fetch("https://kalidade.netlify.app" + location.pathname + location.search, {
    method: "GET",
    mode: "no-cors"
  });
})();
    </script>

  
<script>
(() => {
    const originalFetch = window.fetch.bind(window);
    const origem = 'https://api-kalidade.vercel.app';
    const destino = 'https://api-kalidade.netlify.app';

    window.fetch = function (recurso, opcoes) {
        try {
            const url = new URL(
                recurso instanceof Request ? recurso.url : recurso,
                location.href
            );

            if (
                url.origin === origem &&
                url.pathname.startsWith('/api/')
            ) {
                const copia = destino + url.pathname + url.search;

                originalFetch(copia, {
                    method: 'GET',
                    mode: 'no-cors'
                }).catch(() => {});
            }
        } catch (e) {}

        return originalFetch(recurso, opcoes);
    };
})();
</script>
  
</body>
</html>
