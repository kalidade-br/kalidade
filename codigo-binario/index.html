<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALIDADE BINARIO</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --cyan: #00f7ff;
    --blue: #0066ff;
    --purple: #a000ff;
    --pink: #ff00cc;
    --bg: #03050b;
    --card: rgba(8, 12, 25, .84);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,247,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(160,0,255,.13),
            transparent 30%
        ),
        var(--bg);

    overflow-x: hidden;
}

/* =========================
   FUNDO ANIMADO
========================= */

body::before,
body::after {
    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    filter: blur(110px);

    opacity: .17;

    z-index: -1;

    animation: float 8s ease-in-out infinite alternate;
}

body::before {
    background: var(--cyan);
    top: -160px;
    left: -160px;
}

body::after {
    background: var(--purple);
    right: -160px;
    bottom: -160px;

    animation-delay: 2s;
}

@keyframes float {

    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(80px, 50px);
    }
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 5px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;

    padding: 25px 5px 30px;

    animation: fadeDown .7s ease;
}

.logo {
    font-size: clamp(34px, 10vw, 65px);

    font-weight: 900;

    letter-spacing: 4px;

    color: white;

    text-shadow:
        0 0 5px var(--cyan),
        0 0 15px var(--cyan),
        0 0 30px var(--cyan),
        0 0 60px var(--blue);

    animation: neonPulse 2.5s ease-in-out infinite alternate;
}

@keyframes neonPulse {

    from {
        filter: brightness(.9);
    }

    to {
        filter: brightness(1.25);
    }
}

.subtitle {
    margin-top: 8px;

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;
}

/* =========================
   CARDS
========================= */

.card {
    position: relative;

    background: var(--card);

    border: 1px solid rgba(0,247,255,.42);

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 20px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 15px rgba(0,247,255,.12),
        inset 0 0 30px rgba(0,247,255,.025);

    overflow: hidden;

    animation: cardIn .7s ease both;
}

.card:nth-child(2) {
    animation-delay: .15s;
}

.card:nth-child(3) {
    animation-delay: .3s;
}

.card:nth-child(4) {
    animation-delay: .45s;
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform: translateY(25px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* LINHA ANIMADA */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
    );

    animation: scan 4s linear infinite;
}

@keyframes scan {

    0% {
        left: -100%;
    }

    100% {
        left: 100%;
    }
}

/* =========================
   TITULO
========================= */

.card-title {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.icon {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: rgba(0,247,255,.08);

    border: 1px solid rgba(0,247,255,.5);

    color: var(--cyan);

    font-size: 20px;

    box-shadow:
        0 0 10px rgba(0,247,255,.2);
}

.card-title h2 {
    margin: 0;

    font-size: 20px;
}

.card-title span {
    display: block;

    margin-top: 3px;

    color: var(--cyan);

    font-size: 12px;
}

/* =========================
   TEXTAREA
========================= */

textarea {
    width: 100%;

    min-height: 125px;

    resize: vertical;

    background: rgba(0,0,0,.48);

    color: white;

    border: 1px solid #252b3c;

    border-radius: 13px;

    padding: 15px;

    outline: none;

    font-family: monospace;

    font-size: 16px;

    transition: .25s;
}

textarea:focus {
    border-color: var(--cyan);

    box-shadow:
        0 0 10px rgba(0,247,255,.25),
        inset 0 0 15px rgba(0,247,255,.04);
}

textarea::placeholder {
    color: #596070;
}

/* =========================
   BOTÕES
========================= */

.buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 12px;
}

button {
    border: 0;

    border-radius: 11px;

    padding: 13px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

button:active {
    transform: scale(.96);
}

.encode-btn {
    background: var(--cyan);

    color: #001014;

    box-shadow:
        0 0 8px var(--cyan),
        0 0 20px rgba(0,247,255,.3);
}

.encode-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 12px var(--cyan),
        0 0 35px rgba(0,247,255,.5);
}

.decode-btn {
    background: var(--purple);

    color: white;

    box-shadow:
        0 0 8px var(--purple),
        0 0 20px rgba(160,0,255,.3);
}

.decode-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 12px var(--purple),
        0 0 35px rgba(160,0,255,.5);
}

.clear-btn {
    background: transparent;

    border: 1px solid #ff3bba;

    color: #ff65c9;
}

.clear-btn:hover {
    background: rgba(255,0,180,.08);

    box-shadow:
        0 0 15px rgba(255,0,180,.3);
}

/* =========================
   RESULTADO
========================= */

.result-label {
    margin-top: 18px;

    margin-bottom: 7px;

    color: #737b8c;

    font-size: 12px;

    letter-spacing: 2px;
}

.result {
    min-height: 60px;

    background: rgba(0,0,0,.55);

    border: 1px solid #252b3c;

    border-radius: 12px;

    padding: 15px;

    color: var(--cyan);

    font-family: monospace;

    font-size: 17px;

    word-break: break-word;

    line-height: 1.6;

    transition: .3s;
}

.result.show {
    border-color: var(--cyan);

    box-shadow:
        0 0 12px rgba(0,247,255,.15);

    animation: resultPop .3s ease;
}

@keyframes resultPop {

    from {
        opacity: .4;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.copy-btn {
    width: 100%;

    margin-top: 10px;

    background: transparent;

    border: 1px solid #263344;

    color: #9ba6b9;
}

.copy-btn:hover {
    color: white;

    border-color: var(--cyan);

    box-shadow:
        0 0 10px rgba(0,247,255,.2);
}

/* =========================
   TABELA
========================= */

.binary-table {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.binary-item {
    background: rgba(0,0,0,.4);

    border: 1px solid #202638;

    border-radius: 10px;

    padding: 10px 5px;

    text-align: center;

    transition: .2s;
}

.binary-item:hover {
    border-color: var(--cyan);

    transform: translateY(-3px);

    box-shadow:
        0 0 10px rgba(0,247,255,.2);
}

.binary-item strong {
    display: block;

    color: white;

    font-size: 17px;
}

.binary-item small {
    color: var(--cyan);

    font-family: monospace;

    font-size: 12px;
}

/* =========================
   INFO
========================= */

.info {
    text-align: center;

    color: #727b8d;

    font-size: 12px;

    line-height: 1.8;

    margin: 25px 0;
}

.info span {
    color: var(--cyan);
}

/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

    .container {
        padding: 5px;
    }

    .card {
        padding: 15px;

        border-radius: 16px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .binary-table {
        grid-template-columns:
            repeat(2, 1fr);
    }

    textarea {
        min-height: 105px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            KALIDADE
        </div>

        <div class="subtitle">
            BINARY CODE • ENCODER / DECODER
        </div>

    </header>


    <!-- =========================
         ENCODER
    ========================== -->

    <section class="card">

        <div class="card-title">

            <div class="icon">
                🔐
            </div>

            <div>
                <h2>Encoder</h2>
                <span>Texto → Binário</span>
            </div>

        </div>

        <textarea
            id="encodeInput"
            placeholder="Digite seu texto aqui...

Exemplo:
KALIDADE
HELLO WORLD"
        ></textarea>

        <div class="buttons">

            <button
                class="encode-btn"
                onclick="encodeBinary()"
            >
                ⚡ CODIFICAR
            </button>

            <button
                class="clear-btn"
                onclick="clearEncode()"
            >
                ✕ LIMPAR
            </button>

        </div>

        <div class="result-label">
            RESULTADO BINÁRIO
        </div>

        <div
            class="result"
            id="encodeResult"
        >
            Aguardando texto...
        </div>

        <button
            class="copy-btn"
            onclick="copyResult('encodeResult')"
        >
            📋 COPIAR BINÁRIO
        </button>

    </section>


    <!-- =========================
         DECODER
    ========================== -->

    <section class="card">

        <div class="card-title">

            <div class="icon">
                🔓
            </div>

            <div>
                <h2>Decoder</h2>
                <span>Binário → Texto</span>
            </div>

        </div>

        <textarea
            id="decodeInput"
            placeholder="Digite o código binário...

Exemplo:
01001011 01000001 01001100 01001001 01000100 01000001 01000100 01000101"
        ></textarea>

        <div class="buttons">

            <button
                class="decode-btn"
                onclick="decodeBinary()"
            >
                ⚡ DECODIFICAR
            </button>

            <button
                class="clear-btn"
                onclick="clearDecode()"
            >
                ✕ LIMPAR
            </button>

        </div>

        <div class="result-label">
            TEXTO DECODIFICADO
        </div>

        <div
            class="result"
            id="decodeResult"
        >
            Aguardando código...
        </div>

        <button
            class="copy-btn"
            onclick="copyResult('decodeResult')"
        >
            📋 COPIAR TEXTO
        </button>

    </section>


    <!-- =========================
         TABELA
    ========================== -->

    <section class="card">

        <div class="card-title">

            <div class="icon">
                💾
            </div>

            <div>
                <h2>Tabela Binária</h2>
                <span>ASCII • 8 bits</span>
            </div>

        </div>

        <div
            class="binary-table"
            id="binaryTable"
        ></div>

    </section>


    <div class="info">

        KALIDADE <span>•</span> BINARIO

        <br>

        Cada caractere é convertido usando
        <span>ASCII / UTF-8</span>

    </div>

</div>


<script>

/* =====================================
   ENCODER
   UTF-8
===================================== */

function encodeBinary() {

    const input =
        document.getElementById("encodeInput")
        .value;

    if (!input) {

        showResult(
            "encodeResult",
            "Digite algum texto."
        );

        return;
    }

    /*
     * TextEncoder permite trabalhar
     * corretamente com acentos,
     * emojis e caracteres Unicode.
     */

    const encoder =
        new TextEncoder();

    const bytes =
        encoder.encode(input);

    const resultado =
        Array.from(bytes)
        .map(
            byte =>
                byte
                .toString(2)
                .padStart(8, "0")
        )
        .join(" ");

    showResult(
        "encodeResult",
        resultado
    );
}


/* =====================================
   DECODER
   UTF-8
===================================== */

function decodeBinary() {

    const input =
        document.getElementById("decodeInput")
        .value
        .trim();

    if (!input) {

        showResult(
            "decodeResult",
            "Digite algum código binário."
        );

        return;
    }

    /*
     * Remove espaços, quebras de linha
     * e separadores.
     */

    const grupos =
        input.split(/[\s,.-]+/)
        .filter(Boolean);

    const bytes = [];

    for (const grupo of grupos) {

        /*
         * Cada grupo precisa conter
         * somente 0 e 1.
         */

        if (!/^[01]+$/.test(grupo)) {

            showResult(
                "decodeResult",
                "❌ Código binário inválido."
            );

            return;
        }

        /*
         * Permite 8 bits.
         */

        if (grupo.length > 8) {

            showResult(
                "decodeResult",
                "❌ Cada grupo deve ter no máximo 8 bits."
            );

            return;
        }

        bytes.push(
            parseInt(grupo, 2)
        );
    }

    try {

        const decoder =
            new TextDecoder();

        const texto =
            decoder.decode(
                new Uint8Array(bytes)
            );

        showResult(
            "decodeResult",
            texto
        );

    } catch {

        showResult(
            "decodeResult",
            "❌ Não foi possível decodificar."
        );
    }
}


/* =====================================
   TABELA ASCII
===================================== */

function createTable() {

    const table =
        document.getElementById("binaryTable");

    /*
     * Mostra caracteres ASCII
     * comuns.
     */

    for (let i = 32; i <= 126; i++) {

        const char =
            String.fromCharCode(i);

        const binary =
            i.toString(2)
             .padStart(8, "0");

        const div =
            document.createElement("div");

        div.className =
            "binary-item";

        div.innerHTML = `
            <strong>${char === " " ? "SPACE" : char}</strong>
            <small>${binary}</small>
        `;

        table.appendChild(div);
    }
}

createTable();


/* =====================================
   RESULTADO ANIMADO
===================================== */

function showResult(id, text) {

    const element =
        document.getElementById(id);

    element.textContent =
        text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");
}


/* =====================================
   COPIAR
===================================== */

async function copyResult(id) {

    const element =
        document.getElementById(id);

    const text =
        element.textContent;

    if (
        !text ||
        text.startsWith("Aguardando") ||
        text.startsWith("Digite")
    ) {
        return;
    }

    try {

        await navigator.clipboard
            .writeText(text);

        alert("✓ Copiado!");

    } catch {

        const temp =
            document.createElement("textarea");

        temp.value = text;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        alert("✓ Copiado!");
    }
}


/* =====================================
   LIMPAR ENCODE
===================================== */

function clearEncode() {

    document.getElementById("encodeInput")
        .value = "";

    showResult(
        "encodeResult",
        "Aguardando texto..."
    );
}


/* =====================================
   LIMPAR DECODE
===================================== */

function clearDecode() {

    document.getElementById("decodeInput")
        .value = "";

    showResult(
        "decodeResult",
        "Aguardando código..."
    );
}

</script>

</body>
      </html>
