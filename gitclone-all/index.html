<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Repository Downloader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0f14;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
    background: #111820;
    border: 1px solid #263241;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #8d99a8;
    margin-bottom: 25px;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px 16px;
    background: #0b1016;
    border: 1px solid #303c4b;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #58a6ff;
}

button {
    padding: 14px 20px;
    border: 0;
    border-radius: 10px;
    background: #238636;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #2ea043;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 22px;
    padding: 14px;
    background: #0b1016;
    border-radius: 10px;
    color: #aab5c3;
    min-height: 48px;
}

.progress-box {
    margin-top: 15px;
    display: none;
}

.progress {
    width: 100%;
    height: 8px;
    background: #252e39;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #58a6ff;
    transition: width .2s;
}

.repos {
    margin-top: 20px;
    max-height: 300px;
    overflow-y: auto;
}

.repo {
    padding: 12px;
    border-bottom: 1px solid #222c37;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.repo-name {
    color: #58a6ff;
    font-weight: bold;
}

.repo-status {
    color: #8d99a8;
    font-size: 13px;
}

.error {
    color: #ff7b72;
}

.success {
    color: #56d364;
}

.small {
    margin-top: 15px;
    font-size: 12px;
    color: #697586;
    line-height: 1.5;
}

@media (max-width: 600px) {
    .input-area {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>GitHub Downloader</h1>

    <div class="subtitle">
        Baixe todos os repositórios públicos de um usuário.
    </div>

    <div class="input-area">
        <input
            id="username"
            type="text"
            placeholder="Digite o usuário do GitHub"
            autocomplete="off"
        >

        <button id="downloadBtn">
            BAIXAR TUDO
        </button>
    </div>

    <div id="status" class="status">
        Digite um usuário do GitHub para começar.
    </div>

    <div id="progressBox" class="progress-box">
        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <div id="repos" class="repos"></div>

    <div class="small">
        Apenas repositórios públicos são baixados. Repositórios privados
        exigem autenticação com token do GitHub.
    </div>

</div>

<script>

const usernameInput = document.getElementById("username");
const downloadBtn = document.getElementById("downloadBtn");
const statusEl = document.getElementById("status");
const reposEl = document.getElementById("repos");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");

function setStatus(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = "status " + type;
}

function addRepo(name, status) {

    const div = document.createElement("div");

    div.className = "repo";

    div.innerHTML = `
        <span class="repo-name"></span>
        <span class="repo-status"></span>
    `;

    div.querySelector(".repo-name").textContent = name;
    div.querySelector(".repo-status").textContent = status;

    reposEl.appendChild(div);

    return div.querySelector(".repo-status");
}

async function getAllRepositories(username) {

    let repositories = [];
    let page = 1;

    while (true) {

        const url =
            `https://api.github.com/users/${encodeURIComponent(username)}/repos` +
            `?per_page=100&page=${page}&type=owner&sort=full_name`;

        const response = await fetch(url);

        if (!response.ok) {

            if (response.status === 404) {
                throw new Error("Usuário do GitHub não encontrado.");
            }

            if (response.status === 403) {
                throw new Error(
                    "Limite da API do GitHub atingido. Tente novamente mais tarde."
                );
            }

            throw new Error(
                "Erro ao consultar o GitHub: HTTP " + response.status
            );
        }

        const data = await response.json();

        repositories.push(...data);

        if (data.length < 100) {
            break;
        }

        page++;
    }

    return repositories;
}

async function downloadRepository(repo, zip) {

    const archiveUrl =
        `https://api.github.com/repos/${repo.full_name}/zipball`;

    const response = await fetch(archiveUrl, {
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error(
            `Erro HTTP ${response.status} ao baixar ${repo.name}`
        );
    }

    const blob = await response.blob();

    const arrayBuffer = await blob.arrayBuffer();

    const repoZip = await JSZip.loadAsync(arrayBuffer);

    const files = Object.keys(repoZip.files);

    for (const originalPath of files) {

        const file = repoZip.files[originalPath];

        if (file.dir) {
            continue;
        }

        const parts = originalPath.split("/");

        /*
         * O GitHub cria algo parecido com:
         *
         * usuario-repo-abc123/
         *     arquivo.txt
         *
         * Removemos essa primeira pasta e colocamos:
         *
         * repo/
         *     arquivo.txt
         */

        parts.shift();

        const finalPath =
            `${repo.name}/${parts.join("/")}`;

        const content =
            await file.async("uint8array");

        zip.file(finalPath, content);
    }
}

async function startDownload() {

    const username =
        usernameInput.value.trim();

    if (!username) {
        setStatus("Digite um usuário do GitHub.", "error");
        return;
    }

    downloadBtn.disabled = true;
    reposEl.innerHTML = "";
    progressBox.style.display = "none";
    progressBar.style.width = "0%";

    try {

        setStatus("Buscando repositórios de " + username + "...");

        const repositories =
            await getAllRepositories(username);

        if (!repositories.length) {

            setStatus(
                "Esse usuário não possui repositórios públicos.",
                "error"
            );

            downloadBtn.disabled = false;
            return;
        }

        setStatus(
            `${repositories.length} repositório(s) encontrado(s).`
        );

        progressBox.style.display = "block";

        const zip = new JSZip();

        let completed = 0;

        for (const repo of repositories) {

            const repoStatus =
                addRepo(repo.name, "baixando...");

            try {

                await downloadRepository(repo, zip);

                repoStatus.textContent = "✓ concluído";
                repoStatus.style.color = "#56d364";

            } catch (error) {

                repoStatus.textContent = "✗ erro";

                repoStatus.style.color = "#ff7b72";

                console.error(
                    "Erro no repositório:",
                    repo.full_name,
                    error
                );
            }

            completed++;

            const percentage =
                Math.round(
                    (completed / repositories.length) * 100
                );

            progressBar.style.width =
                percentage + "%";

            setStatus(
                `Baixando ${completed}/${repositories.length} — ${repo.name}`
            );
        }

        setStatus(
            "Gerando arquivo ZIP...",
            ""
        );

        const finalBlob =
            await zip.generateAsync(
                {
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: 6
                    }
                },
                function(metadata) {

                    progressBar.style.width =
                        metadata.percent.toFixed(0) + "%";
                }
            );

        const url =
            URL.createObjectURL(finalBlob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            `${username}-github-repositories.zip`;

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 10000);

        setStatus(
            `Concluído! ${repositories.length} repositório(s) foram processados.`,
            "success"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            error.message || "Ocorreu um erro.",
            "error"
        );

    } finally {

        downloadBtn.disabled = false;
    }
}

downloadBtn.addEventListener(
    "click",
    startDownload
);

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            startDownload();
        }

    }
);

</script>

</body>
</html>
