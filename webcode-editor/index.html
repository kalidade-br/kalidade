<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KALIDADE WEBCODE EDITOR</title><meta name="color-scheme" content="light dark">
<style>

#lg form>div{font-size:48px}#lg h2{margin:6px 0 18px}#lg input{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;outline:0}
</style></head><body>
<div id="app"><div class="hd"><div class="ht"><button class="hb" id="bk">📦</button><div class="tt" id="ti"></div></div><div class="cr" id="cr"></div></div>
<div class="sb"><span id="st"></span><input id="q" placeholder="🔍 Buscar nesta pasta"></div><div id="ls"></div></div>

<div class="fx" id="ed"><div class="fh"><button class="bt" id="eb">←</button><b id="en"></b><button class="bt" id="er">▶ Executar</button><button class="bt pr" id="es">💾</button></div><div class="tb"><button class="ub" id="un" title="Voltar (desfazer)">↶</button><div class="br">KALIDADE WEBCODE EDITOR<br><span id="hc"></span></div><button class="ub" id="re" title="Avançar (refazer)">↷</button></div><textarea id="ta" spellcheck="false" autocapitalize="off"></textarea></div>
<div class="fx" id="rn"><div class="fh"><button class="bt" id="rc">✕</button><b id="rt"></b><button class="bt" id="rr">⟳</button></div><iframe id="rf" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe></div>
<div class="fx" id="iv"><div class="fh" style="position:absolute;top:0;left:0;right:0"><button class="bt" id="ic">✕</button><b id="in2"></b></div><img id="im"></div>
<div class="ov" id="mo"><div class="md"><h3 id="mt"></h3><div id="mb"></div><div class="mf"><button class="bt" id="mc">Cancelar</button><button class="bt pr" id="mok"></button></div></div></div>
<div id="cm"></div><div id="tt"></div><input type="file" id="fi" multiple hidden><input type="file" id="fj" accept=".json" hidden>
<script>
const LS='zafs_v1',$=s=>document.querySelector(s),ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'',base=p=>p.split('/').pop(),dir=p=>p.slice(0,p.lastIndexOf('/'))||'/',join=(d,n)=>(d==='/'?'':d)+'/'+n,esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const IMG=['png','jpg','jpeg','gif','webp','ico','bmp','avif'],FONT=['woff','woff2','ttf'],BIN=IMG.concat(FONT),TXT=['txt','md','html','htm','css','js','json','xml','svg','csv','log','yml','yaml','ini','map','webmanifest',''],NOTE=['txt','md','log','csv'];
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',ico:'image/x-icon',bmp:'image/bmp',avif:'image/avif',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf'};
const isBin=n=>BIN.includes(ext(n)),allowed=n=>BIN.includes(ext(n))||TXT.includes(ext(n)),isImg=n=>IMG.includes(ext(n))||ext(n)=='svg',runnable=n=>['html','htm','js','md','svg'].includes(ext(n));
const icon=n=>{const e=ext(n);return isImg(n)?'🖼️':FONT.includes(e)?'🔤':NOTE.includes(e)?'📝':['html','htm'].includes(e)?'🌐':e=='css'?'🎨':e=='js'?'⚡':'💻'};
let fs={},cwd='/',sel=null,cur=null,tm,rp=null;
try{fs=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(fs));return 1}catch(e){toast('Sem espaço no localStorage!',1);return 0}};
function toast(m,e){const t=$('#tt');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2500)}
const kids=d=>Object.keys(fs).filter(p=>dir(p)===d),under=p=>Object.keys(fs).filter(k=>k===p||k.startsWith(p+'/'));
const bytes=p=>{if(p=='/')return Object.keys(fs).reduce((a,k)=>a+(fs[k].t=='f'?bytes(k):0),0);const n=fs[p];if(n.t=='d')return under(p).reduce((a,k)=>a+(k===p||fs[k].t=='d'?0:bytes(k)),0);return isBin(p)?Math.round((n.c.length-n.c.indexOf(',')-1)*.75):new Blob([n.c]).size};
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function render(){
 const k=kids(cwd).filter(p=>base(p).toLowerCase().includes($('#q').value.toLowerCase())).sort((a,b)=>(fs[a].t==fs[b].t?0:fs[a].t=='d'?-1:1)||base(a).localeCompare(base(b),'pt',{numeric:1}));
 $('#ti').textContent='KALIDADE WEBCODE EDITOR';$('#bk').textContent=cwd=='/'?'📦':'←';
 let a='',acc='';a+='<a data-p="/">🏠</a>';cwd.split('/').filter(Boolean).forEach(s=>{acc+='/'+s;a+=' › <a data-p="'+esc(acc)+'">'+esc(s)+'</a>'});$('#cr').innerHTML=a;
 const all=kids(cwd);$('#st').textContent='📁 '+all.filter(p=>fs[p].t=='d').length+'  📄 '+all.filter(p=>fs[p].t=='f').length+'  💾 '+fmt(bytes(cwd=='/'?'/':cwd));
 $('#ls').innerHTML=k.length?k.map(p=>{const n=fs[p],d=n.t=='d';return`<div class="it" data-p="${esc(p)}"><div class="ic ${d?'d':''}">${d?'📁':icon(p)}</div><div class="in"><div class="nm">${esc(base(p))}</div><div class="mt"><span>${d?kids(p).length+' itens':fmt(bytes(p))}</span><span>${dt(n.m)}</span></div></div><div class="ac">⋮</div></div>`}).join(''):'<div class="em"><div>📂</div>Pasta vazia</div>'}
const nav=p=>{cwd=p;$('#q').value='';render()};
function uniq(d,n){let p=join(d,n),i=1,e=n.includes('.')?'.'+ext(n):'',b=e?n.slice(0,-e.length):n;while(fs[p])p=join(d,b+' ('+i+++')'+e);return p}
function ask(t,body,ok,cb,dg){$('#mt').textContent=t;$('#mb').innerHTML=body;const b=$('#mok');b.textContent=ok||'';b.className='bt '+(dg?'dg':'pr');b.style.display=ok?'':'none';$('#mc').textContent=ok?'Cancelar':'Fechar';$('#mo').classList.add('on');b.onclick=()=>{if(cb&&cb()===false)return;$('#mo').classList.remove('on')};const i=$('#mb input');if(i)setTimeout(()=>{i.focus();i.select()},60)}
$('#mc').onclick=()=>$('#mo').classList.remove('on');
const val=()=>$('#mb input').value.trim();
function mk(t){ask(t=='d'?'Nova pasta':'Novo arquivo','<input placeholder="'+(t=='d'?'Nome da pasta':'arquivo.txt')+'">','Criar',()=>{const n=val();if(!n||n.includes('/'))return toast('Nome inválido',1),false;if(t=='f'&&!allowed(n))return toast('Tipo não suportado: só arquivos estáticos e notas',1),false;if(fs[join(cwd,n)])return toast('Já existe',1),false;fs[join(cwd,n)]={t,c:'',m:Date.now()};save();render()})}
async function upl(files){let ok=0,bad=[];for(const f of files){if(!allowed(f.name)){bad.push(f.name);continue}const c=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);isBin(f.name)?fr.readAsDataURL(f):fr.readAsText(f)});fs[uniq(cwd,f.name)]={t:'f',c,m:Date.now()};ok++}save();render();toast(ok+' enviado(s)'+(bad.length?' · bloqueado: '+bad.join(', '):''),!ok)}
function reloc(o,n,copy){const ks=under(o),ts=Date.now();ks.forEach(k=>{const nk=n+k.slice(o.length);fs[nk]=copy?{...fs[k],m:ts}:fs[k];if(!copy)delete fs[k]})}
function folders(ex){return['/'].concat(Object.keys(fs).filter(p=>fs[p].t=='d'&&!(ex&&(p===ex||p.startsWith(ex+'/')))))}
function mv(p,copy){ask(copy?'Copiar para':'Mover para','<select>'+folders(fs[p].t=='d'?p:'').map(f=>'<option value="'+esc(f)+'">'+esc(f)+'</option>').join('')+'</select>','OK',()=>{const d=$('#mb select').value,t=uniq(d,base(p));if(!copy&&d===dir(p))return;reloc(p,t,copy);save();render();toast(copy?'Copiado':'Movido')})}
function dl(p){const n=fs[p],a=document.createElement('a');a.download=base(p);a.href=isBin(p)?n.c:URL.createObjectURL(new Blob([n.c],{type:(MIME[ext(p)]||'text/plain')+';charset=utf-8'}));a.click()}
function info(p){const n=fs[p],d=n.t=='d',r=(a,b)=>'<div class="ir"><span>'+a+'</span><span>'+esc(b)+'</span></div>';ask('Informações',r('Nome',base(p))+r('Tipo',d?'Pasta':'Arquivo .'+(ext(p)||'txt'))+r('Tamanho',fmt(bytes(p)))+(d?r('Itens',under(p).length-1+' (total)'):'')+r('Modificado',new Date(n.m).toLocaleString('pt-BR'))+r('Caminho',p))}
function menu(p,x,y){sel=p;const d=fs[p].t=='d',it=[['op',d?'📂 Abrir':'✏️ Editar']];if(!d&&runnable(p))it.push(['ru','▶️ Executar']);it.push(['in','ℹ️ Informações'],['rn','✏️ Renomear'],['mv','📤 Mover'],['cp','📋 Copiar']);if(!d)it.push(['dl','⬇️ Baixar']);it.push(['de','🗑️ Excluir']);
 const m=$('#cm');m.innerHTML=it.map(i=>'<div class="mi'+(i[0]=='de'?' r':'')+'" data-a="'+i[0]+'">'+i[1]+'</div>').join('');m.classList.add('on');m.style.left=Math.max(8,Math.min(x,innerWidth-215))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px'}
function act(a){const p=sel;$('#cm').classList.remove('on');$('#fm').classList.remove('on');
 if(a=='nd')mk('d');else if(a=='nf')mk('f');else if(a=='up')$('#fi').click();
 else if(a=='ex'){const b=new Blob([JSON.stringify(fs)],{type:'application/json'}),l=document.createElement('a');l.download='zarchiver-backup.json';l.href=URL.createObjectURL(b);l.click()}
 else if(a=='im')$('#fj').click();
 else if(a=='op')open_(p);else if(a=='ru')run(p);else if(a=='in')info(p);else if(a=='mv')mv(p);else if(a=='cp')mv(p,1);else if(a=='dl')dl(p);
 else if(a=='rn')ask('Renomear','<input value="'+esc(base(p))+'">','Renomear',()=>{const n=val(),t=join(dir(p),n);if(!n||n.includes('/'))return toast('Nome inválido',1),false;if(fs[p].t=='f'&&!allowed(n))return toast('Tipo não suportado',1),false;if(t===p)return;if(fs[t])return toast('Já existe',1),false;reloc(p,t);save();render()});
 else if(a=='de')ask('Excluir','Excluir <b>'+esc(base(p))+'</b>'+(fs[p].t=='d'?' e tudo dentro dela':'')+'?<br><small style="color:var(--dg)">Não pode ser desfeito.</small>','Excluir',()=>{under(p).forEach(k=>delete fs[k]);save();render()},1)}
function open_(p){const n=fs[p];if(n.t=='d')return nav(p);if(isBin(p)){if(IMG.includes(ext(p))){$('#im').src=n.c;$('#in2').textContent=base(p);$('#iv').classList.add('on')}else info(p);return}if(ext(p)=='svg'&&0)return;edit(p)}
function edit(p){cur=p;$('#en').textContent=base(p);$('#ta').value=fs[p].c;hreset();$('#er').style.display=runnable(p)?'':'none';$('#ed').classList.add('on')}
function sv(q){if(!cur||!fs[cur])return;fs[cur].c=$('#ta').value;fs[cur].m=Date.now();if(save()&&!q)toast('Salvo ✔')}
let at,H=[],hi=0,busy=0;const TA=$('#ta');
const snap=()=>({v:TA.value,a:TA.selectionStart,b:TA.selectionEnd});
function hui(){$('#un').disabled=hi<=0;$('#re').disabled=hi>=H.length-1;$('#hc').textContent=hi+' / '+(H.length-1)}
function hreset(){H=[snap()];hi=0;hui()}
function hpush(){if(busy)return;if(H[hi]&&H[hi].v===TA.value)return;H.length=hi+1;H.push(snap());if(H.length>1500)H.shift();hi=H.length-1;hui()}
function hgo(d){const n=hi+d;if(n<0||n>=H.length)return;hi=n;const x=H[hi];busy=1;const st=TA.scrollTop,sl=TA.scrollLeft;TA.value=x.v;TA.setSelectionRange(x.a,x.b);TA.scrollTop=st;TA.scrollLeft=sl;busy=0;hui();clearTimeout(at);at=setTimeout(()=>sv(1),800)}
function hold(el,d){let t,r;const stop=()=>{clearTimeout(t);clearInterval(r)};el.addEventListener('pointerdown',e=>{e.preventDefault();hgo(d);t=setTimeout(()=>{r=setInterval(()=>hgo(d),70)},400)});['pointerup','pointerleave','pointercancel'].forEach(k=>el.addEventListener(k,stop));el.onclick=e=>e.preventDefault()}
hold($('#un'),-1);hold($('#re'),1);
TA.oninput=()=>{hpush();clearTimeout(at);at=setTimeout(()=>sv(1),800)};
TA.addEventListener('beforeinput',e=>{if(e.inputType=='historyUndo'){e.preventDefault();hgo(-1)}else if(e.inputType=='historyRedo'){e.preventDefault();hgo(1)}});
$('#ta').onkeydown=e=>{const t=e.target;if(e.key=='Tab'){e.preventDefault();const s=t.selectionStart;t.setRangeText('    ',s,t.selectionEnd,'end');t.oninput()}const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k=='s'){e.preventDefault();sv()}if((e.ctrlKey||e.metaKey)&&k=='z'){e.preventDefault();hgo(e.shiftKey?1:-1)}if((e.ctrlKey||e.metaKey)&&k=='y'){e.preventDefault();hgo(1)}};
$('#es').onclick=()=>sv();$('#eb').onclick=()=>{sv(1);$('#ed').classList.remove('on');cur=null;render()};$('#er').onclick=()=>{sv(1);run(cur)};
function res(b,r){if(/^(https?:|data:|#|\/\/|blob:|mailto:|javascript:)/i.test(r))return null;r=r.split(/[?#]/)[0];const parts=r[0]=='/'?[]:dir(b).split('/').filter(Boolean);r.split('/').forEach(s=>{if(s=='..')parts.pop();else if(s&&s!='.')parts.push(s)});const q='/'+parts.join('/');return fs[q]&&fs[q].t=='f'?q:null}
const uri=q=>isBin(q)?fs[q].c:'data:'+(MIME[ext(q)]||'text/plain')+';charset=utf-8,'+encodeURIComponent(fs[q].c);
function bundle(p,h){const css=(b,c)=>c.replace(/url\((['"]?)([^'")]+)\1\)/g,(m,_,u)=>{const q=res(b,u);return q?'url('+uri(q)+')':m});
